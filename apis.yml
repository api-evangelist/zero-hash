- name: zerohash Auth (Connect) API
  description: >-
    Session and access-token API behind the zerohash Auth product for onchain account linking across custodial and
    non-custodial wallets. Two operations — OAuth 2.0 client-credentials token issuance and session creation — secured
    with a JWT bearer token carrying the customers:token:issue scope. The published OpenAPI 3.0.3 declares only the
    sandbox server (api.sandbox.connect.xyz); it is documented on the zerohash docs host under the Connect category.
  humanURL: https://docs.zerohash.com/reference/getaccesstoken
  baseURL: https://api.sandbox.connect.xyz
  tags:
  - authentication
  - account-linking
  - digital-assets
  - oauth2
  properties:
  - type: OpenAPI
    url: openapi/zero-hash-connect-openapi.yml
  - type: APIReference
    url: https://docs.zerohash.com/reference/getaccesstoken
  - type: Documentation
    url: https://docs.zerohash.com/docs/auth-network
  - type: OAuthScopes
    url: scopes/zero-hash-scopes.yml
- name: zerohash Private WebSocket API
  description: >-
    Authenticated WebSocket feed delivering a full account-balance snapshot on subscribe followed by incremental
    balance-updated events, plus RFQ liquidity bid/ask price levels per subscribed symbol. Every message carries its
    own HMAC-SHA256 signature, key, passphrase and timestamp; clients must ping every 20 seconds to hold the session.
  humanURL: https://docs.zerohash.com/reference/private-websocket-api
  baseURL: https://ws.zerohash.com
  tags:
  - websockets
  - market-data
  - digital-assets
  properties:
  - type: APIReference
    url: https://docs.zerohash.com/reference/private-websocket-api
  - type: Webhooks
    url: asyncapi/zero-hash-webhooks.yml
