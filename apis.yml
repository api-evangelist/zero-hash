apis:
- name: zerohash Private WebSocket API
  description: >-
    Authenticated WebSocket feed delivering a full account-balance snapshot on subscribe followed by incremental
    balance-updated events, plus RFQ liquidity bid/ask price levels per subscribed symbol. Every message
    carries its own HMAC-SHA256 signature, key, passphrase and timestamp; clients must ping every 20 seconds
    to hold the session.
  humanURL: https://docs.zerohash.com/reference/private-websocket-api
