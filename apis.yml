apis:
- name: zerohash API
  description: >-
    The core zerohash REST API — 167 operations across participants, accounts, assets, trades, liquidity (RFQ), the
    central limit order book, deposits, withdrawals, transfers, positions, market data, payments, payins, payouts,
    convert-and-withdraw, fund, staking, rewards, awards and portfolio strategies. Authenticated with HMAC-SHA256
    request signing over X-SCX-API-KEY / X-SCX-SIGNED / X-SCX-TIMESTAMP / X-SCX-PASSPHRASE headers, with
    per-environment IP allowlisting. Published as OpenAPI 3.1.0 v1.7.0 by the provider's own documentation host.
  humanURL: https://docs.zerohash.com/reference
  baseURL: https://api.zerohash.com
