aid: zero-hash
name: Zero Hash
description: >-
  Zero Hash is a regulated digital-asset infrastructure provider that lets banks, brokerages, fintechs, payroll
  platforms and payment service providers embed crypto, stablecoin and tokenized-asset capability without holding
  licenses or running blockchain infrastructure themselves. The platform covers trading (RFQ liquidity and a central
  limit order book reachable over REST and FIX 5.0), qualified custody, staking, rewards and portfolio strategies,
  plus a Transact side that handles on/off ramps, account funding, payins, payouts, remittances and settlement across
  100+ assets and 40+ chains. Participant onboarding, KYC, sanctions screening, jurisdiction evaluation and travel-rule
  handling are exposed as first-class API resources, and a Tokenize product line covers a tokenization engine and
  tokenization payment rails. Integration surfaces include a 167-operation REST API secured with HMAC-SHA256 request
  signing, a private WebSocket feed for balances and RFQ prices, a FIX gateway for CLOB order entry and market data,
  an outbound webhook catalog, and a large family of embeddable JavaScript/React SDK modules for buy, sell, onboarding,
  funding, withdrawals and account linking.
