gaps:
- >-
  No public sandbox — CERT requires an onboarded account and an allowlisted static IP, so an evaluating developer
  cannot make a first call without a sales conversation.
- >-
  The X-Simulator-Scenario values are not enumerated in the published OpenAPI.
