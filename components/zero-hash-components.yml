generated: '2026-08-05'
method: searched
source: https://docs.zerohash.com/reference/sdk-overview
docs: https://docs.zerohash.com/reference/sdk-modules
notes: >-
  The zerohash SDK is a library of embeddable, prebuilt UI modules rather than a server-side client. Each module is a
  self-contained flow (buy, sell, onboard, fund, withdraw, link an account) rendered inside the platform's own
  application and authorized by a short-lived client auth token. Modules ship in matched pairs — a framework-agnostic
  JavaScript build and a React build — under the @zerohash-sdk npm scope, with a Capacitor plugin and per-platform
  webview guides for mobile. Distinct from the REST API packages catalogued in packages/zero-hash-packages.yml.
authorization:
  docs: https://docs.zerohash.com/reference/sdk-authorization
  flow: >-
    The platform's backend calls POST /client-auth-token to mint a short-lived token scoped to a participant, hands it
    to the browser, and the SDK module uses it; POST /revoke-auth-token invalidates it.
  operations:
  - POST /client-auth-token
  - POST /revoke-auth-token
  permissions_docs: https://docs.zerohash.com/reference/iframe-integration-permissions
loaders:
- name: '@zerohash-sdk/* (JavaScript)'
  registry: npm
  note: Framework-agnostic build of each module.
- name: '@zerohash-sdk/*-react (React)'
  registry: npm
  note: React component build of each module.
- name: '@zerohash-sdk/capacitor'
  registry: npm
  note: Capacitor plugin used to host the modules inside iOS/Android apps.
- name: zh-web-sdk
  registry: npm
  note: Original monolithic browser SDK, still published (3.4.3).
