notes: >-
  zerohash ships its client libraries as a large family of scoped npm packages under @zerohash-sdk, one module per
  embedded flow, in matched framework-agnostic JavaScript and React pairs, plus a Capacitor plugin for mobile and the
  older monolithic zh-web-sdk (published from the seedcx GitHub organization). No first-party server-side SDK was
  found on PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io — the REST API is signed with
  HMAC-SHA256 and integrated directly. `zero-python-sdk` on PyPI is an unrelated third-party project.
