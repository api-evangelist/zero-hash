    Code500:
      type: object
      description: An unexpected error occurred on the server. The request can be retried after a short delay, but the same inputs may reproduce the error.
      required:
      - error
      properties:
        error:
          type: string
          example: Internal Server Error
    GetDocumentMetadataResponse:
      type: object
      properties:
        message:
          type: object
          properties:
            participant_code:
              type: string
              description: 'Unique alphanumeric code for the participant (format: 6 alphanumeric characters).'
              example: ABCDEF
            documents:
              type: array
              description: Array of document metadata objects for the participant. Returns an empty array if no documents exist.
              items:
                $ref: '#/components/schemas/DocumentMetadataEntity'
    GetDocumentForDownloadResponse:
      type: object
      properties:
        message:
          type: object
          properties:
            document_id:
              type: string
              description: Unique identifier (SHA-256 hash) for the document.
              example: e39e7b6a908e397dac50e461eb2d284820214ca2cb3c4aa9aeb9dfc1873332a0
            file_name:
              type: string
              description: Original file name of the uploaded document.
              example: passport.pdf
            participant_code:
              type: string
              description: 'Unique alphanumeric code for the participant (format: 6 alphanumeric characters).'
              example: ABCDEF
            document_type:
              $ref: '#/components/schemas/DocumentType'
            id_front:
              type: boolean
              description: Indicates whether this is the front side of an ID document. Only present/applicable when the document is an identity document with front/back sides.
            created_at:
              type: number
              format: int64
              description: Unix timestamp in milliseconds indicating when the document was uploaded.
              example: 1678901234567
            signed_url:
              type: string
              format: uri
              description: Presigned S3 URL for downloading the document. Expires after 15 minutes.
              example: https://s3.amazonaws.com/bucket/documents/abc123?X-Amz-Expires=900&...
            mime_type:
              type: string
              description: MIME type of the document file.
              example: application/pdf
    Code400:
      type: object
      description: Request was rejected by validation or a downstream service. `errors` is an array of human-readable messages; each entry describes a single validation failure or business-rule violation.
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: string
          example:
          - body/amount must be >= 0
          - body/asset is required
    DocumentType:
      type: string
      enum:
      - articles_of_incorporation
      - articles_of_organization
      - business_license
      - business_name_filing_document
      - by_laws
      - certificate_of_good_standing
