                        - ORDER_REJECT_REASON_UNDEFINED
                        description: 'The reason for an order rejection, which is populated on the execution report if the execution report has an `execution_type` of `EXECUTION_TYPE_REJECTED`. This field may be populated by the exchange to indicate the reason for the order rejection.


                          - `ORD_REJECT_REASON_EXCHANGE_OPTION`: The order was rejected due to an option exercised by the exchange, such as a market-wide halt or a symbol-specific halt.

                          - `ORD_REJECT_REASON_UNKNOWN_SYMBOL`: The order was rejected due to an unknown symbol.

                          - `ORD_REJECT_REASON_EXCHANGE_CLOSED`: The order was rejected because the exchange is closed.

                          - `ORD_REJECT_REASON_INCORRECT_QUANTITY`: The order was rejected due to an incorrect quantity, such as an order quantity that is not a multiple of the minimum quantity or that exceeds the maximum quantity allowed by the exchange.

                          - `ORD_REJECT_REASON_INVALID_PRICE_INCREMENT`: The order was rejected due to an invalid price increment, such as a limit price that is not a multiple of the minimum price increment allowed by the exchange.

                          - `ORD_REJECT_REASON_INCORRECT_ORDER_TYPE`: The order was rejected due to an incorrect order type, such as a stop-limit order without a stop price.

                          - `ORD_REJECT_REASON_PRICE_OUT_OF_BOUNDS`: The order was rejected due to a price that is outside of the normal price bands or limits set by the exchange.

                          - `ORD_REJECT_REASON_NO_LIQUIDITY`: The order was rejected due to no liquidity available at the specified price.

                          - `ORDER_REJECT_REASON_UNDEFINED`: An unset value for the order reject reason uses the default behavior of the exchange, which is typically to treat the reason as unknown.

