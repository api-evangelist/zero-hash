                          - `EXECUTION_TYPE_NEW`: The execution was a new order.

                          - `EXECUTION_TYPE_PARTIAL_FILL`: The execution was a partial fill.

                          - `EXECUTION_TYPE_FILL`: The execution was a fill.

                          - `EXECUTION_TYPE_CANCELED`: The execution was a cancel.

                          - `EXECUTION_TYPE_REPLACE`: The execution was a replace.

                          - `EXECUTION_TYPE_REJECTED`: The execution was rejected.

                          - `EXECUTION_TYPE_EXPIRED`: The execution expired.

                          - `EXECUTION_TYPE_DONE_FOR_DAY`: The execution was done for the day.

                          '
                      unsolicited_cancel_reason:
                        type: string
                        example: UNSOLICITED_CXL_REASON_CONNECTION_LOSS
                        enum:
                        - UNSOLICITED_CXL_REASON_UNDEFINED
                        - UNSOLICITED_CXL_REASON_CONNECTION_LOSS
                        - UNSOLICITED_CXL_REASON_LOGOUT
                        - UNSOLICITED_CXL_REASON_EXCHANGE_OPTION
                        - UNSOLICITED_CXL_REASON_OTHER
                        description: 'The reason for an unsolicited cancel execution, which is a cancel execution that is not the result of an explicit cancel request from the participant. This field may be populated by the exchange to indicate the reason for the unsolicited cancel.


                          - `UNSOLICITED_CXL_REASON_UNDEFINED`: An unset value for the unsolicited cancel reason uses the default behavior of the exchange, which is typically to treat the reason as unknown.

                          - `UNSOLICITED_CXL_REASON_CONNECTION_LOSS`: The execution was canceled due to a loss of connectivity between the participant and the exchange.

                          - `UNSOLICITED_CXL_REASON_LOGOUT`: The execution was canceled due to the participant logging out of their trading session.

                          - `UNSOLICITED_CXL_REASON_EXCHANGE_OPTION`: The execution was canceled due to an option exercised by the exchange, such as a market-wide halt or a symbol-specific halt.

                          - `UNSOLICITED_CXL_REASON_OTHER`: The execution was canceled due to other reasons not specified above.

                          '
