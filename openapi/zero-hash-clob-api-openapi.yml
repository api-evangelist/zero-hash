    PostSearchExecutionsResponse:
      type: object
      properties:
        eof:
          type: boolean
        executions:
          type: array
          items:
            type: object
            properties:
              aggressor:
                type: boolean
                example: true
                description: 'Indicates if the execution was initiated by the aggressor. An aggressor is the party that initiates the trade by placing an order that matches with an existing resting order on the order book.


                  - If `aggressor` is `true`, it means that the execution was the result of an incoming order matching with a resting order, and the incoming order is considered the aggressor.

                  - If `aggressor` is `false`, it means that the execution was the result of a resting order being matched by an incoming order, and the resting order is considered the aggressor.'
              commission_notional_collected:
                type: string
                example: '100.00'
                description: The notional amount of commission collected for the execution.
              id:
                type: string
                example: 90VSYQ3YJ076
                description: Unique identifier for the execution.
              last_px:
                type: string
                example: '100.00'
                description: The last price of the execution. This is the price at which the trade was executed, scaled by using the `price_scale` of the order.
              last_shares:
                type: string
                example: '10'
                description: The last shares of the execution scaled by using the `fractional_quantity_scale` of the order. This is the quantity that was executed in this trade.
              leg_prices:
                type: array
                items:
                  type: object
                  properties:
                    anchor:
                      type: boolean
                    px:
                      type: string
                      example: '100.00'
                      description: The price of the leg, scaled by using the `price_scale` of the order.
                    qty:
                      type: string
                      example: '10'
                      description: The quantity of the leg, scaled by using the `fractional_quantity_scale` of the order.
                    reference_px:
                      type: string
                      example: '100.00'
                      description: The reference price of the leg, scaled by using the `price_scale` of the order.
                    side:
                      type: string
                      example: SIDE_BUY
                      enum:
                      - SIDE_BUY
                      - SIDE_SELL
                      description: The side of the leg, either `SIDE_BUY` or `SIDE_SELL`.
                    symbol:
                      type: string
                      example: BTC/USD
                      description: The symbol of the leg.
              order:
                type: object
                properties:
                  id:
                    type: string
                    example: 51H5D2K2A00M
                    description: Unique order identifier.
                  type:
                    type: string
                    example: ORDER_TYPE_LIMIT
                    enum:
                    - ORDER_TYPE_MARKET_TO_LIMIT
                    - ORDER_TYPE_LIMIT
