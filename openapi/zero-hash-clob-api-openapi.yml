                            enum:
                            - CONDITION_TRIGGER_METHOD_UNDEFINED
                            - CONDITION_TRIGGER_METHOD_LAST_PRICE
                            - CONDITION_TRIGGER_METHOD_SETTLEMENT_PRICE
                          price_to_quantity_filled:
                            type: object
                            additionalProperties:
                              type: string
