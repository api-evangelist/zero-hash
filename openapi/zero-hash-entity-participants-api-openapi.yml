        tax_id:
          type: string
          description: "The national ID of the control person, e.g. a social security number. Required if `citizenship=United States` or `citizenship_code=US`. \nNote: if `citizenship=United States`, and `tax_id` begins with `9`, then `id_number_type` and `id_number` are also required."
          example: 000-00-0000
        id_number_type:
          type: string
          enum:
          - us_drivers_license
          - us_passport
          - us_passport_card
          - us_permanent_resident_card
          - us_border_crossing_card
          - us_alien_card
          - us_id_card
          - non_us_passport
          - non_us_other
          - passport
          - eu_drivers_license
          - national_id
          - legal_entity_identifier
          - chamber_of_commerce_number
          - value_added_tax_number
          description: 'The type of identification number provided.


            **Allowed values:**

            - `us_drivers_license` - US Driver''s License

            - `us_passport` - US Passport

            - `us_passport_card` - US Passport Card

            - `us_permanent_resident_card` - US Permanent Resident Card (Green Card)

            - `us_border_crossing_card` - US Border Crossing Card

            - `us_alien_card` - US Alien Registration Card

            - `us_id_card` - US State-issued ID Card

            - `non_us_passport` - Non-US Passport

            - `non_us_other` - Other Non-US identification (requires `non_us_other_type` field)

            - `passport` - Generic passport

            - `eu_drivers_license` - European Union Driver''s License

            - `national_id` - National identity card

            - `legal_entity_identifier` - Legal Entity Identifier (LEI) for organizations

            - `chamber_of_commerce_number` - Chamber of Commerce registration number

            - `value_added_tax_number` - VAT identification number


            **Conditional requirements:**

            - When `id_number_type` is `non_us_other`, the `non_us_other_type` field is required.

            **Note:** Required when citizenship is not `United States` or `tax_id` is not an SSN.'
          example: us_passport
        id_number:
          type: string
          description: "ID number of the ID document provided. \nRequired when citizenship is not `United States` or `tax_id` is not an SSN\t"
          example: '123456789'
        id_issuing_authority:
          type: string
          description: ISO-3166-1_A2 country code that issued the ID. Required if `id_number` is provided.
          example: null
        sanction_screening:
          type: string
          enum:
          - pass
          - fail
          description: 'Result of the control person''s sanctions screening.


            **Allowed values:**

            - `pass` - Control person passed sanctions screening

            - `fail` - Control person failed sanctions screening'
          example: pass
        sanction_screening_timestamp:
          type: number
          description: UNIX timestamp (in milliseconds) when the sanctions screening was performed on the control person.
          example: 1603378501286
        kyc:
          type: string
          enum:
          - pass
          - fail
          description: 'Whether the control person passed or failed KYC verification by vendor.


            **Allowed values:**

            - `pass` - KYC verification passed

            - `fail` - KYC verification failed'
          example: pass
        kyc_timestamp:
          type: number
          description: The UNIX timestamp (in milliseconds) when KYC was passed. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
          example: 1603378501286
        control_person:
          type: number
          enum:
          - 0
          - 1
          - 2
          - 3
          description: 'Designation of what percent of the business the control person controls.


            **Allowed values:**

            - `0` - Unknown

            - `1` - Less than 10%

            - `2` - Greater than or equal to 10% but less than 25%

            - `3` - Greater than or equal to 25%'
          example: 1
