          merchant_category_code:
            type: string
            description: ISO 18245 four-digit Merchant Category Code (MCC) that identifies the business activity of the entity. Accepted on entity create/update; zerohash derives `merchant_category_code_category` and `merchant_category_code_classification` from this value.
            example: '5411'
          chamber_of_commerce_number:
            type: string
            description: Chamber of commerce registration number for EU entities.
            example: KVK-12345678
          activity_locations:
            type: array
            items:
              type: string
            description: ISO-3166-1 alpha-2 country codes where the entity conducts business activities.
            example:
            - DE
            - NL
            - FR
          entity_source_of_funds:
            type: string
            enum:
            - operating_revenues
            - capital_investment
            - debt_financing
            - asset_sale
            - crypto_activities
            - investment_returns
            - grants_and_subsidies
            - other
            description: Primary source of funds for the entity.
            example: operating_revenues
          entity_source_of_funds_description:
            type: string
            description: Description of entity source of funds, required when entity_source_of_funds is "other".
            example: Revenue from proprietary trading algorithms
          entity_sub_type:
            type: string
            enum:
            - trust_llc
            - trust_sole_proprietorship
            - trust_other
            description: Sub-classification of entity type, applicable to trust entities.
            example: trust_llc
          is_complex_structure:
            type: boolean
            description: Whether the entity has a complex ownership structure.
            example: false
          declaration_no_effective_control:
            type: boolean
            description: Declaration that no individual has effective control beyond listed beneficial owners.
            example: true
          declaration_no_effective_control_at:
            type: number
            format: int64
            description: Unix timestamp in milliseconds when declaration_no_effective_control was made.
            example: 1603378501286
          declaration_no_foreseeable_changes:
            type: boolean
            description: Declaration that no foreseeable changes to the beneficial ownership structure are expected.
            example: true
          declaration_no_foreseeable_changes_at:
            type: number
            format: int64
            description: Unix timestamp in milliseconds when declaration_no_foreseeable_changes was made.
            example: 1603378501286
          reason_for_business_relationship:
            type: string
            description: Reason for establishing the business relationship with zerohash. Optional in both US and EU variants.
            example: Digital asset custody and trading services for institutional clients
          board_members:
            type: array
            items:
              $ref: '#/components/schemas/BoardMemberEntity'
            description: Board members of the entity. Required for EU entities.
