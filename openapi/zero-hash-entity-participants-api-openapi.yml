              type: array
              items:
                $ref: '#/components/schemas/ControlPersonResponseEntity'
            beneficial_owners:
              type: array
              items:
                $ref: '#/components/schemas/BeneficialOwnerResponseEntity'
            participant_code:
              type: string
              example: XXXXXX
            status:
              type: string
              example: approved
