                  example: business_profits
                withholding_rate:
                  type: string
                  description: Reduced rate granted by the treaty article, as a string percentage (e.g. "0", "10", "15"). Required when `is_eligible = true`.
                  example: '0'
                article_paragraph:
                  type: string
                  description: Treaty article and paragraph authorizing the rate (e.g. "Article 7, paragraph 1"). Free text but should match the actual treaty section. Required when `is_eligible = true`.
                  example: Article 7
                additional_conditions:
                  type: boolean
                  description: Whether the entity asserts that extra conditions in the treaty article are met. Send `true` only if the entity has affirmatively confirmed. Required when `is_eligible = true`.
                  example: false
                requirements_certification:
                  type: boolean
                  description: Entity's on-form attestation that it derives the relevant income and meets all qualifying tests of the treaty provision. Must be `true` when an entity is claiming treaty benefits in order to generate a W-8 form. Required when `is_eligible = true`.
                  example: true
                limitation_on_benefits:
                  type: string
                  enum:
                  - government
                  - tax_exempt_pension
                  - other_tax_exempt_organization
                  - publicly_traded_corporation
                  - subsidiary
                  - company_meets_erosion_test
                  - company_meets_derivative_test
                  - company_meets_business_test
                  - favorable_determination
                  - no_lob_article
                  - other_article_paragraph
                  description: Which Limitation on Benefits (LOB) clause the entity qualifies under. Required when `is_eligible = true`. Accepted string tokens listed in enum; legacy numeric values still accepted for backward compatibility.
                  example: publicly_traded_corporation
                limitation_on_benefits_other:
                  type: string
                  description: Free-text describing the article and paragraph the entity is relying on. Required when (and only when) `limitation_on_benefits = other_article_paragraph`.
                  example: ''
