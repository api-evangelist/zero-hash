    PatchUserBody:
      type: object
      properties:
        first_name:
          type: string
          example: John
          description: The first name of the user
        middle_name:
          type: string
          description: The middle name of the user
        last_name:
          type: string
          example: Smith
          description: The last name of the user
        email:
          type: string
          description: Email address of the user
          example: test@example.com
        contact_number:
          type: string
          description: The phone number of the user. Must be in E.164 format
          example: '+15557778888'
        address_one:
          type: string
          description: 'First line for the user''s address.


            Notes:

            - The regular maximum length is 80 characters.


            - If the platform is on the vendor reliance track, the maximum length increases to 200 characters.

            - PO Box addresses are not accepted.'
          example: 123 Main St.
        address_two:
          type: string
          description: 'Extra information, like an apartment or suite number.


            Notes:

            - The regular maximum length is 50 characters.

            - If the platform is on the vendor reliance track, the maximum length increases to 200 characters.

            - PO Box addresses are not accepted.'
          example: Suite 1000
        city:
          type: string
          description: City of the user
          example: Chicago
        postal_code:
          type: string
          description: Postal, or zip code, of the user, in the format "min 4 characters, no leading or trailing spaces" for non-US postal code or <5digits>-<4digits> for US zip code, e.g. 77777 or 77777-7777
          example: '12345'
        jurisdiction_code:
          type: string
          example: US-IL
          description: The ISO 3166-2 subdivision code that the user resides in
