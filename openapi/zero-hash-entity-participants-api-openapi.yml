    PatchEntityBody:
      type: object
      properties:
        entity_name:
          type: string
          description: Name of the business
          example: Entity Name
        legal_name:
          type: string
          description: Registered legal name of the entity. This should not be a DBA or DBA equivalent
          example: Legal Name
        contact_number:
          type: string
          description: Phone number of the business
          example: '15557778888'
        website:
          type: string
          description: Business website
          example: company.com
        date_established:
          type: string
          description: Date the business was established. This should reflect government registration for the entity in the format `YYYY-MM-DD`
          example: '1985-09-02'
        entity_type:
          type: string
          enum:
          - corporation
          - llc
          - partnership
          - sole_proprietorship
          - other
          - non_profit
          - llc_c
          - llc_s
          - llc_p
          - s_corporation
          - c_corporation
          - trust_estate
          - trust
          description: The type of business that is onboarding, must be one of the supported
          example: llc
        address_one:
          type: string
          description: 'First line for the business''s address.


            Notes:

            - The regular maximum length is 80 characters.

            - If the platform is on the vendor reliance track, the maximum length increases to 200 characters.

            - PO Box addresses are not accepted.'
          example: 123 Main St.
        address_two:
          type: string
          description: 'Extra information, like an apartment or suite number.


            Notes:

            - The regular maximum length is 50 characters.

            - If the platform is on the vendor reliance track, the maximum length increases to 200 characters.

            - PO Box addresses are not accepted.'
          example: Suite 1000
        city:
          type: string
          description: The city customer resides in
          example: Chicago
        postal_code:
          type: string
          description: Postal, or zip code, of the business, in the format "min 4 characters, no leading or trailing spaces" for non-US postal code or <5digits>-<4digits> for US zip code, e.g. 77777 or 77777-7777
          example: '12345'
        tax_id:
          type: string
          description: Tax identifier of the business (e.g. EIN in United States)
          example: 000-00-0000
        id_issuing_authority:
          type: string
          description: ISO-3166-1_A2 country code that issued the tax identifier (e.g. “US”)
          example: null
        risk_rating:
          type: string
          enum:
          - low
          - medium
          - high
          description: Risk assessed by the platform's vendor
          example: null
        onboarding_profile:
          type: string
          enum:
          - kyc_track
          - shopper
          - originator_entity
          - payouts_payor_ultimate
          - payouts_beneficiary
          description: Onboarding profile used to determine the entity's KYC track. Optional. Defaults to 'kyc_track' when omitted.
          example: kyc_track
        sanction_screening:
          type: string
          enum:
          - pass
          - fail
          description: "Result of the business sanctions screen\t"
          example: pass
        sanction_screening_timestamp:
          type: number
          description: "The time the sanctions screen was done\t"
          example: 1603378501286
        self_certification_timestamp:
          type: number
          description: The UNIX timestamp (in milliseconds) when the participant completed self-certification for DAC8 compliance. Mandatory for participants that are based in Europe.
          example: 1667504636159
        signed_timestamp:
          type: number
          description: The time at which the business accepted zerohash services agreements
          example: 1603378501286
