          type: array
          description: The agreements signed by the entity. An array of agreement objects with region, type, and timestamp.
          items:
            type: object
            required:
            - region
            - signed_timestamp
            properties:
              type:
                type: string
                enum:
                - fund_auto_convert
                - payment_services_terms
                - account_link
                - account_funding_payouts
                - account_funding_general
                - account_funding_pay
                - crypto_payouts_service_terms
                - staking
                - trust_agreement
                - zhllc_user_agreement_v1
                - zhllc_privacy_policy_v1
                - zhllc_regulatory_disclosures_v1
                - auth_user_services_agreement_v1
                - zhllc_payment_sender_terms_v1
                - zhllc_third_party_disclosures_v1
                - connect_privacy_policy_v1
                description: The type of the agreement signed
                example: user_agreement
              region:
                type: string
                enum:
                - worldwide
                - us
                - brazil
                - uk
                - eu
                description: The region for the signed agreement
                example: us
              signed_timestamp:
                type: number
                description: The UNIX timestamp (in milliseconds) when the Agreement was accepted by the entity. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
                example: 1603378501286
