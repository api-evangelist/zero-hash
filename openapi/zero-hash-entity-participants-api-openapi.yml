            - under_100k
            - between_100k_and_250k
            - between_250k_and_500k
            - over_500k
            description: Expected annual transaction volume for the entity. Required for EU entities.
            example: over_500k
          jurisdiction_code:
            type: string
            example: US-IL
            description: The ISO 3166-2 subdivision code that the entity resides in
