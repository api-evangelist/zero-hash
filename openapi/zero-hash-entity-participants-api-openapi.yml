        is_not_subject_backup_withholding:
          type: boolean
          description: "Backup withholding attestation flag. Required for customers onboarded to a US platform.\n - If the participant confirms they are **not** subject to backup withholding, this field should be set to `true`.\n - If the participant **is** subject to backup withholding, this field should be set to `false`.\nThis acts as a positive attestation that the participant confirms they are not subject to backup withholding."
          example: false
        dba_name:
          type: string
          description: Doing Business As (DBA) name of the entity
          example: ABC Trading Co
        other_entity_type:
          type: string
          description: Other entity type description when entity_type is "other"
          example: Trust
        w8_ben_e:
          type: object
          description: Wrapper sub-object holding W-8BEN-E tax certification data for a foreign (non-US) entity customer. Inherits all shared W-8 fields plus the entity-only fields below. Optional at the wrapper level.
          properties:
            tax_classification:
              type: string
              enum:
              - individual
              - corporation
              - partnership
              - simple_trust
              - complex_trust
              - grantor_trust
              - estate
              - central_bank_of_issue
              - foreign_government_controlled_entity
              - foreign_government_integral_part
              - tax_exempt_organization
              - private_foundation
              - international_organization
              description: Entity's IRS tax classification (e.g. corporation, partnership, trust variants, estate, tax-exempt organization). Required for W-8 form generation when `w8_ben_e` is present. Accepted string tokens listed in enum; legacy numeric values still accepted for backward compatibility.
