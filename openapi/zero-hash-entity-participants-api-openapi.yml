            - `us_passport_card` - US Passport Card

            - `us_permanent_resident_card` - US Permanent Resident Card (Green Card)

            - `us_border_crossing_card` - US Border Crossing Card

            - `us_alien_card` - US Alien Registration Card

            - `us_id_card` - US State-issued ID Card

            - `non_us_passport` - Non-US Passport

            - `non_us_other` - Other Non-US identification (requires `non_us_other_type` field)

            - `passport` - Generic passport

            - `eu_drivers_license` - European Union Driver''s License

            - `national_id` - National identity card

            - `legal_entity_identifier` - Legal Entity Identifier (LEI) for organizations

            - `chamber_of_commerce_number` - Chamber of Commerce registration number

            - `value_added_tax_number` - VAT identification number


            **Conditional requirements:**

            - When `id_number_type` is `non_us_other`, the `non_us_other_type` field is required.

            **Note:** Required when citizenship is not `United States` or `tax_id` is not an SSN.'
          example: us_passport
        id_number:
          type: string
          description: "ID number of the ID document provided. \nRequired when citizenship is not `United States` or `tax_id` is not an SSN\t"
          example: '123456789'
        id_issuing_authority:
          type: string
          description: ISO-3166-1_A2 country code that issued the ID. Required if `id_number` is provided.
          example: null
        sanction_screening:
          type: string
          enum:
          - pass
          - fail
          description: 'Result of the beneficial owner''s sanctions screening.


            **Allowed values:**

            - `pass` - Beneficial owner passed sanctions screening

            - `fail` - Beneficial owner failed sanctions screening'
          example: pass
        sanction_screening_timestamp:
          type: number
          description: UNIX timestamp (in milliseconds) when the sanctions screening was performed on the beneficial owner.
          example: 1603378501286
        kyc:
          type: string
          enum:
          - pass
          - fail
          description: 'Whether the beneficial owner passed or failed KYC verification by vendor.


            **Allowed values:**

            - `pass` - KYC verification passed

            - `fail` - KYC verification failed'
          example: pass
        kyc_timestamp:
          type: number
          description: The UNIX timestamp (in milliseconds) when KYC was passed. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
          example: 1603378501286
        beneficial_owner:
          type: number
          enum:
          - 0
          - 1
          - 2
          description: 'Designation of what percent of the business the beneficial owner owns.


            **Allowed values:**

            - `0` - Unknown

            - `1` - Greater than or equal to 10% but less than 25%

            - `2` - Greater than or equal to 25%'
          example: 1
        role:
          type: string
          description: The role of the beneficial owner
          example: ''
    Code400:
      type: object
      description: Request was rejected by validation or a downstream service. `errors` is an array of human-readable messages; each entry describes a single validation failure or business-rule violation.
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: string
          example:
          - body/amount must be >= 0
          - body/asset is required
    PostEntityBody:
      oneOf:
      - title: US Entity
        type: object
        description: US entity (non-natural person) onboarding. Required fields reflect US regulatory requirements.
        properties:
          platform_code:
            type: string
            description: zerohash platform code of the submitting platform
            example: PLAT01
          entity_name:
            type: string
            description: Name of the business
            example: Entity Name
          legal_name:
            type: string
            description: Registered legal name of the entity. This should not be a DBA or DBA equivalent
            example: Legal Name
          contact_number:
            type: string
            description: Phone number of the business
            example: '15557778888'
          website:
            type: string
            description: Business website
            example: company.com
          date_established:
            type: string
            description: Date the business was established. This should reflect government registration for the entity in the format `YYYY-MM-DD`
            example: '1985-09-02'
          entity_type:
            type: string
            enum:
            - corporation
            - llc
            - partnership
            - sole_proprietorship
            - other
            - non_profit
            - llc_c
            - llc_s
            - llc_p
            - s_corporation
            - c_corporation
            - trust_estate
            - trust
            description: The type of business that is onboarding, must be one of the supported
            example: llc
          address_one:
            type: string
            description: 'First line for the business''s address.


              Notes:

              - The regular maximum length is 80 characters.

              - If the platform is on the vendor reliance track, the maximum length increases to 200 characters.

              - PO Box addresses are not accepted.'
            example: 123 Main St.
          address_two:
            type: string
            description: 'Extra information, like an apartment or suite number.


              Notes:

              - The regular maximum length is 50 characters.

              - If the platform is on the vendor reliance track, the maximum length increases to 200 characters.

              - PO Box addresses are not accepted.'
            example: Suite 1000
          city:
            type: string
            description: The city customer resides in
            example: Chicago
          postal_code:
            type: string
            description: Postal, or zip code, of the business, in the format "min 4 characters, no leading or trailing spaces" for non-US postal code or <5digits>-<4digits> for US zip code, e.g. 77777 or 77777-7777
            example: '12345'
          tax_id:
            type: string
            description: Tax identifier of the business (e.g. EIN in United States)
            example: 000-00-0000
          id_issuing_authority:
            type: string
            description: ISO-3166-1_A2 country code that issued the tax identifier (e.g. “US”)
            example: null
          risk_rating:
            type: string
            enum:
            - low
            - medium
            - high
            description: Risk assessed by the platform's vendor
            example: null
          onboarding_profile:
            type: string
            enum:
            - kyc_track
            - shopper
            - originator_entity
            - payouts_payor_ultimate
            - payouts_beneficiary
            description: Onboarding profile used to determine the entity's KYC track. Optional. Defaults to 'kyc_track' when omitted.
            example: kyc_track
          sanction_screening:
            type: string
            enum:
            - pass
            - fail
            description: "Result of the business sanctions screen\t"
            example: pass
          sanction_screening_timestamp:
            type: number
            description: "The time the sanctions screen was done\t"
            example: 1603378501286
          self_certification_timestamp:
            type: number
            description: The UNIX timestamp (in milliseconds) when the participant completed self-certification for DAC8 compliance. Mandatory for participants that are based in Europe.
            example: 1667504636159
          metadata:
            oneOf:
            - type: object
              properties: {}
              description: Can be used to submit any additional unstructured metadata as JSON object
              example: {}
            - type: string
              description: Can be used to submit any additional unstructured metadata as JSON string
              example: '{"field1": "string_value", "field2": 123, "field3": true}'
          signed_timestamp:
            type: number
            description: The time at which the business accepted zerohash services agreements
            example: 1603378501286
          signed_agreements:
            type: array
            description: The agreements signed by the entity. An array of agreement objects with region, type, and timestamp.
            items:
              type: object
              required:
              - region
              - signed_timestamp
              properties:
                type:
                  type: string
                  enum:
                  - fund_auto_convert
                  - payment_services_terms
                  - account_link
                  - account_funding_payouts
                  - account_funding_general
                  - account_funding_pay
                  - crypto_payouts_service_terms
                  - staking
                  - trust_agreement
                  - zhllc_user_agreement_v1
                  - zhllc_privacy_policy_v1
                  - zhllc_regulatory_disclosures_v1
                  - auth_user_services_agreement_v1
                  - zhllc_payment_sender_terms_v1
                  - zhllc_third_party_disclosures_v1
                  - connect_privacy_policy_v1
                  description: The type of the agreement signed
                  example: user_agreement
                region:
                  type: string
                  enum:
                  - worldwide
                  - us
                  - brazil
                  - uk
                  - eu
                  description: The region for the signed agreement
                  example: us
                signed_timestamp:
                  type: number
                  description: The UNIX timestamp (in milliseconds) when the Agreement was accepted by the entity. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
                  example: 1603378501286
          submitter_email:
            type: string
            description: Email of the person who completed the KYC application and agreed to terms
            example: test@example.com
          submitter_first_name:
            type: string
            description: Submitter first name
            example: Jon
          submitter_last_name:
            type: string
            description: Submitter last name
            example: Doe
          submitter_title:
            type: string
            description: The title or honorific of the individual submitting the form (e.g., Mr., Ms., Dr.).
            example: Mr.
          control_persons:
            type: array
            items:
              $ref: '#/components/schemas/ControlPersonEntity'
          beneficial_owners:
            type: array
            items:
              $ref: '#/components/schemas/BeneficialOwnerEntity'
          incorporation_address:
            type: object
            description: Full address where the entity is incorporated
            required:
            - jurisdiction_code
            properties:
              address_one:
                type: string
                description: First line of incorporation address
              address_two:
                type: string
                description: Second line of incorporation address (optional)
              city:
                type: string
                description: City of incorporation
              jurisdiction_code:
                type: string
                description: Jurisdiction code in ISO-3166-2 format
                example: IT-25
              postal_code:
                type: string
                description: Postal code of incorporation address
          tax_residence:
            type: object
            description: Tax residence address for the entity
            required:
            - jurisdiction_code
            properties:
              address_one:
                type: string
                description: First line of tax residence address
              address_two:
                type: string
                description: Second line of tax residence address (optional)
              city:
                type: string
                description: City of tax residence
              jurisdiction_code:
                type: string
                description: Jurisdiction code in ISO-3166-2 format
                example: PT-11
              postal_code:
                type: string
                description: Postal code of tax residence
          tin_jurisdiction_reason:
            type: string
            enum:
            - working_abroad
            - studying_abroad
            - dual_residency
            - business_abroad
            - real_estate_abroad
            - other
            description: Optional. Reason for the tax residence jurisdiction differing from the legal jurisdiction. Defaults to "unknown" if not provided.
            example: working_abroad
          additional_tax_residences:
            type: array
            maxItems: 25
            items:
              $ref: '#/components/schemas/AdditionalTaxResidence'
            description: Optional. Additional tax residences when the entity has tax obligations in multiple jurisdictions. Maximum 25 items.
          tin_jurisdiction_other:
            type: string
            description: Optional. Free text explanation when `tin_jurisdiction_reason` is `other`
