            ftin:
              type: string
              description: Foreign tax identification number issued by the entity's country of tax residence. Required unless `ftin_required = false`.
              example: DE123456789
            ftin_required:
              type: boolean
              description: Whether the entity's country legally issues an FTIN. Required whenever the sub-object is present.
