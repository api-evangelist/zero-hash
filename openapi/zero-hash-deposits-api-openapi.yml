          type: string
          format: email
          description: The participant's email address.
          example: jane.doe@example.com
    CryptoDepositEntity:
      type: object
      properties:
        depositId:
          type: string
          description: Unique identifier for the deposit
          example: dep_abc123
        accountId:
          type: string
          description: Account ID the deposit belongs to
          example: 80289ce5-072b-4739-929d-dcc5ccc542f3
        participantCode:
          type: string
          description: Participant code of the deposit owner
          example: ABC123
        transactionHash:
          type: string
          description: Blockchain transaction hash
          example: '0x408482348dcb0e0331a9148d50f8c76db08138f63fb1586fcfc45200a91ccc5f'
        asset:
          type: string
          description: Asset code (e.g. BTC, ETH)
          example: BTC
        amount:
          type: string
          description: Deposit amount
          example: '1.5'
        sourceAddress:
          type: string
          description: Source blockchain address
          example: 0x73dFE6E1696FB1cf4648B954aB608a593a382B8G
        receivedAddress:
          type: string
          description: Receiving blockchain address
          example: '0xB38CeBE03b2b6705744795F36921DE27c70A7C62'
        state:
          type: string
          description: Current deposit state
          example: confirmed
        timestamp:
          type: string
          description: Deposit timestamp in RFC3339 format
          example: '2024-01-01T00:00:00Z'
        stateReason:
          type: string
          nullable: true
          description: Machine-readable reason the deposit is in its current state (e.g. `required_travel_rule_info`).
          example: required_travel_rule_info
        travelRuleStatus:
          type: string
          enum:
          - not_required
          - allowed
          - action_required
          - processing
          - blocked
          - unknown
          - pending
          - completed
          description: Travel Rule status for the deposit, derived for the deposit operation. `allowed` — the address ownership account is approved, no restriction; `action_required` — the customer must submit ownership data (call `GET /travel-rule/status?intention_action=deposit` for the fields to collect); `processing` — submitted or being collected, under Compliance review (no user action); `blocked` — cannot proceed (limit or revoked account); `unknown` — the ownership account status could not be determined; `not_required` — deposit not subject to Travel Rule. `pending` / `completed` are legacy values still returned while the rollout flag is off.
        travelRuleCollectionDeadline:
          type: string
          format: date-time
          nullable: true
          description: Deadline by which Travel Rule information must be submitted. RFC3339 timestamp. Only present when the deposit is held for Travel Rule (state_reason = required_travel_rule_info). Computed as the PENDING_COMPLIANCE_REVIEW transition timestamp + 48h. Absent for deposits not subject to Travel Rule collection.
          example: '2026-06-11T09:26:42Z'
        notional:
          type: object
          nullable: true
          description: Notional value of the deposit captured at compliance-evaluation time. Present only when a EUR price was available at detection time; absent otherwise. Used for EU TFR cumulative €1,000 threshold tracking.
          properties:
            value:
              type: string
              description: Notional value of the deposit at detection time.
              example: '46000.00'
            rate:
              type: string
              description: Price per unit of asset at detection time. `rate × amount = value`. Stored for compliance auditability.
              example: '92000.00'
            quotedAsset:
              type: string
              description: Asset the value and rate are quoted in.
              example: EUR
        history:
          type: array
          items:
            $ref: '#/components/schemas/StateTransitionEntity'
          description: State transition history
    PostDigitalAssetAddressesResponse:
