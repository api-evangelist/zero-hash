    FiatAccountEntity:
      type: object
      properties:
        type:
          type: string
          enum:
          - united_states_wire
          - international_wire
          - internal_transfer
          description: The type of the fiat account. `united_states_wire` is used for domestic US wire instructions; `international_wire` is used for wires sent from outside the US; `internal_transfer` is used for platform-internal transfers.
          example: united_states_wire
        shortName:
          type: string
          description: Short, display-friendly name of the bank.
          example: BMO Harris
        bankName:
          type: string
          description: Full legal name of the bank.
          example: BMO Harris Bank N.A.
        bankPhysicalAddress:
          type: string
          description: Physical address of the bank.
          example: 115 S LaSalle, 18W, Chicago, IL 60603
        accountNumber:
          type: string
          description: zerohash's account number at the bank.
          example: 440-554-4
        routingNumber:
          type: string
          description: Routing (ABA) number of the bank. Only returned for `united_states_wire` accounts.
          example: 021214891
        swift:
          type: string
          description: SWIFT/BIC code of the bank. Only returned for `international_wire` accounts.
          example: HATRUS44
        recipientName:
          type: string
          description: Name the wire should be addressed to.
          example: Zero Hash LLC
        recipientPhysicalAddress:
          type: string
          description: Physical address of the recipient.
          example: 327 N. Aberdeen St., FL 1, Chicago, IL 60607
        reference:
          type: string
          description: Your participant code. Must be included in the wire reference/memo field so the deposit can be allocated to your account.
          example: ABCDEF
        correspondentBankName:
          type: string
          description: Correspondent bank name. Only returned for `international_wire` accounts when a correspondent is required.
        correspondentBranchName:
          type: string
          description: Correspondent branch name. Only returned for `international_wire` accounts when a correspondent is required.
        correspondentBranchAddress:
          type: string
          description: Correspondent branch address. Only returned for `international_wire` accounts when a correspondent is required.
        correspondentSwift:
          type: string
          description: Correspondent bank SWIFT/BIC. Only returned for `international_wire` accounts when a correspondent is required.
        correspondentAccountNumber:
          type: string
          description: zerohash's account number at the correspondent bank. Only returned for `international_wire` accounts when a correspondent is required.
        allowedWireTypes:
          type: array
          items:
            type: string
            enum:
            - retail
            - institutional
          description: The types of wires allowed for this bank account.
          example:
          - retail
          - institutional
      required:
      - type
      - shortName
      - bankName
      - accountNumber
      - recipientName
      - reference
    DepositResponseEntity:
      type: object
      properties:
        settle_timestamp:
          type: number
          format: int64
          description: Unix timestamp in milliseconds indicating when the deposit was credited to the participant. This also matches the `movement_timestamp` on the corresponding movement.
          example: 1590663417000
        account_id:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for the account the deposit was credited to.
          example: 80289ce5-072b-4739-929d-dcc5ccc542f3
        movement_id:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for the movement created by this deposit.
          example: 21bdbb11-712f-4cb7-a178-4f277c80cde0
        participant_code:
          type: string
          description: The participant that was credited with the deposit.
          example: ABCDEF
        account_group:
          type: string
          description: The account group associated with the account that received the deposit (e.g. `00SCXM` for the zerohash house account group).
          example: 00SCXM
        account_label:
          type: string
          description: The account label under the participant that received the deposit.
          example: general
        asset:
          type: string
          description: The asset code of the deposit (e.g. `BTC`, `USD`).
          example: BTC
        amount:
          type: string
          description: The amount that was deposited into the account.
          example: '4.0000'
        reference_id:
          type: string
          description: An external identifier associated with the deposit. Context-specific depending on the asset and source — for fiat this is typically the wire/ACH reference, for crypto it is the on-chain transaction ID.
          example: 408482348dcb0e0331a9148d50f8c76db08138f63fb1586fcfc45200a91ccc5f
        source:
          type: string
          nullable: true
          description: The bank from which the fiat deposit was made or the blockchain address from which the crypto deposit came. Returns `null` when the upstream service does not report a source (e.g. some fiat deposits).
          example: 0x73dFE6E1696FB1cf4648B954aB608a593a382B8G
        received_address:
          type: string
          nullable: true
          description: The deposit address that received the funds. Returns `null` for fiat deposits and for crypto deposits where no receive address is recorded.
          example: '0xB38CeBE03b2b6705744795F36921DE27c70A7C62'
        run_id:
          type: string
          description: Identifier for the settlement run that booked the deposit.
          example: '12613'
        state_reason:
          type: string
          nullable: true
          description: 'Machine-readable reason the deposit is in its current state. Populated for blockchain deposits held for Travel Rule verification: `required_travel_rule_info` — awaiting TR resolution; `travel_rule_info_received` — resolved successfully; `travel_rule_info_timeout` — 48h timer expired. Absent for fiat deposits and blockchain deposits not subject to Travel Rule.'
          example: required_travel_rule_info
        travel_rule_status:
          type: string
          enum:
          - pending
          - completed
          - not_required
          description: Human-readable Travel Rule status. Always present for blockchain deposits. `pending` — deposit is held awaiting TR verification; `completed` — TR resolved (info received or 48h timer elapsed); `not_required` — deposit never entered a TR-hold state. Absent for fiat deposits.
