    FiatAccountsEntity:
      type: object
      description: "The whitelisted withdrawal account or address to withdraw funds to\n    Note: only one of withdrawal_account_id, address or account{} can be submitted per withdrawal, but zerohash will always respond with withdrawal_account_id"
      properties:
        withdrawal_account_id:
          type: number
          description: The ID of the withdrawal account
          example: 286
        name:
          type: string
          description: "The nickname given to the withdrawal account\n        Note: zerohash will append the last 4 digits of the account number to this when saving it"
          example: Primary (1234)
        status:
          type: string
          description: "The approval status of the withdrawal account\t"
          example: PENDING_CREATION
          enum:
          - PENDING_CREATION
          - APPROVED
          - REJECTED
          - DELETED
          - PENDING_CHANGE
        limit:
          type: number
          description: The limit applied to the account on a per-withdrawal basis
          example: 750000
        type:
          type: string
          description: 'The type of account: REAL_TIME_FIAT for 24/7 USD withdrawals, DOMESTIC_FIAT for US wires or INTERNATIONAL_FIAT for international wires'
          example: DOMESTIC_FIAT
        beneficiary_name:
          type: string
          description: The owner of the account at the withdrawal destination
          example: John Doe
        account_number:
          type: string
          description: The unique IBAN or account number for the final withdrawal destination
          example: '1231234'
        bank_name:
          type: string
          description: The name of the destination financial institution
          example: BMO Harris
        routing_number:
          type: string
          description: For US wires, the ABA routing number identifies the destination financial institution
          example: '07102343'
        swift_code:
          type: string
          description: SWIFT code, if applicable
        recipient_instructions:
          type: string
          description: Any additional instructions on the account
        intermediary_bank_name:
          type: string
          description: Intermediary bank name, if applicable
        intermediary_bank_code_type:
          type: string
          description: "Intermediary bank identifier code type, if applicable\n      Options include SWIFT"
        intermediary_bank_code:
          type: string
          description: Intermediary bank identifier that corresponds to intermediary_bank_code_type, if applicable
        intermediary_bank_account_number:
          type: string
          description: Intermediary bank IBAN or account number, if applicable
        correspondent_bank_name:
          type: string
          description: Correspondent bank name, if applicable
        correspondent_bank_code_type:
          type: string
          description: "Correspondent bank identifier code type, if applicable\n      Options include SWIFT"
        correspondent_bank_code:
          type: string
          description: Correspondent bank identifier that corresponds to correspondent_bank_code_type, if applicable
        correspondent_bank_account_number:
          type: string
          description: Correspondent bank IBAN or account number, if applicable
        last_update:
          type: number
          description: Timestamp for when the withdrawal address last update
          example: '1571175076187'
        participant_code:
          type: string
          description: The participant the request belongs to, e.g. ABCDEF
          example: ABCDEF
    WithdrawalAddressesEntity:
      type: object
      properties:
        withdrawal_account_id:
          type: number
          description: The ID of the withdrawal account the address belongs to
          example: 78
        name:
          type: string
          description: The nickname the address was given when it was created
          example: Fund ABC Wallet
        address:
          type: string
          description: The blockchain address
          example: M9zjMhjaPfwaeyeH2SY6aWyGqdTS9feg8Z
        status:
          type: string
          description: The approval status of the address
          example: APPROVED
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - DELETED
        asset:
          type: string
          description: The asset code for the specific account, e.g. BTC
          example: LTC
        limit:
          type: number
          description: "The limit applied to the account on a per-withdrawal basis\t"
          example: 1000
        last_update:
          type: number
          description: Timestamp for when the withdrawal address last update
          example: '1554395972174'
        submitted_address:
          type: string
          description: This is the original value for an address submitted by you, that was converted into a newer format supported by zerohash - this will be null if no conversion is necessary
          example: BTC
        account_group:
          type: string
          description: The account group the request was made against, e.g. 00SCXM for the Seed Digital Commodities Market account group
          example: 33nb3pKcSZ69rUNNvZYkksisWvrzCmi3Jt
        participant_code:
          type: string
          description: The participant the request belongs to, e.g. ABCDEF
          example: ABCDEF
    ExecuteResponse:
      type: object
      description: Response body returned by POST /withdrawals/execute, describing the executed withdrawal.
      properties:
        request_id:
          type: string
          format: uuid
          description: Server-generated request identifier for this execution. Returned as part of the audit trail for the call.
          example: 81904785-c092-41cd-9497-9198749e1b67
        withdrawal_quote_id:
          type: string
          format: uuid
          description: The locked network fee quote ID that was executed. Matches the `withdrawal_quote_id` supplied on the request.
          example: bdc4c936-8505-4e61-b859-f3a5a6bdc880
        withdrawal_request_id:
          type: string
          format: uuid
          description: The underlying withdrawal request ID created as a result of this execution. Use this value with GET /withdrawals/requests/{id} to poll status.
          example: ffbfce91-8256-47b5-b079-e12a2c0198a2
        participant_code:
          type: string
          description: The participant code the withdrawal is debited against.
          example: ABCDEF
        account_group:
          type: string
          description: The `account_group` for the source account the withdrawal is debited from.
          example: JMCH0H
        account_label:
          type: string
          description: The `account_label` for the source account the withdrawal is debited from.
          example: general
        withdrawal_address:
          type: string
          description: The on-chain address that will receive the crypto asset. Only populated when the quote was requested by address (rather than by `withdrawal_account_id`).
          example: bc1qy08yh0cm565gvtx2z80dz6dnyr635mwtknl36e
        withdrawal_account_id:
          type: string
          description: The whitelisted withdrawal account identifier used for the withdrawal. Only populated when the quote was requested by `withdrawal_account_id`.
          example: '146'
        destination_tag:
          type: string
          description: The destination tag or memo ID associated with the transaction. Required when the asset is EOS, XLM, or XRP and `no_destination_tag` is false. Returned as an empty string when not applicable.
          example: ''
        no_destination_tag:
          type: boolean
          description: Whether the destination address requires a destination tag. False for tag-based assets when a tag is included. zerohash requires `no_destination_tag` to be `false` for EOS.
          example: false
        asset:
          type: string
          description: The asset being withdrawn.
          example: BTC
        amount:
          type: string
          description: The requested withdrawal amount.
          example: '0.04867615'
        amount_notional:
          type: string
          description: The notional value of the withdrawal amount in USD at the time the quote was locked.
          example: '3832.51'
        network_fee:
          type: string
          description: The network fee quantity being deducted from the requested withdrawal amount.
          example: '0.00000282'
        network_fee_notional:
          type: string
          description: The network fee notional value in USD.
          example: '0.22'
        on_chain_status:
          type: string
          description: The status of the withdrawal on the blockchain at the time of execution. Newly executed withdrawals return `PENDING`; the status transitions to `CONFIRMED` once the transaction is confirmed on-chain.
          enum:
          - CONFIRMED
          - PENDING
          example: PENDING
        withdrawal_fee:
          type: string
          description: The withdrawal fee (denominated in the withdrawn asset) charged by zerohash for this execution. Returns "0" when no withdrawal fee applies.
          example: '0'
        client_withdrawal_request_id:
          type: string
          description: The client-supplied `client_withdrawal_request_id` echoed back, or an empty string when none was supplied.
          example: ''
    Code500:
      type: object
      description: An unexpected error occurred on the server. The request can be retried after a short delay, but the same inputs may reproduce the error.
      required:
      - error
      properties:
        error:
          type: string
          example: Internal Server Error
