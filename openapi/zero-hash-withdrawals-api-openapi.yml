openapi: 3.2.0
info:
  title: zerohash Withdrawals API
  description: '

    ### Authentication


    zerohash Uses HMAC SHA-256 verification to ensure the authenticity of API requests, follow instructions by link [https://docs.zerohash.com/reference/api-authentication](https://docs.zerohash.com/reference/api-authentication)


    <a href="/zh-swagger.json">Download zerohash OpenAPI Schema as JSON</a>

    '
  version: 1.7.0
servers:
- url: https://api.cert.zerohash.com
  description: Certification API server
security:
- apiKey: []
  apiPassphrase: []
tags:
- name: Withdrawals
  description: Initiate and monitor withdrawals from accounts
paths:
  /withdrawals/requests:
    post:
      tags:
      - Withdrawals
      summary: Create withdrawal request
      description: "Creates new withdrawal requests to be settled. Withdrawal requests created through the API go directly into an APPROVED state. \nTo retrieve withdrawal account IDs use the `GET /withdrawals/digital_asset_addresses` and `GET /withdrawals/fiat_accounts` endpoints."
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        description: Withdrawal request details including account ID, asset, amount, and destination information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequestBody'
      responses:
        '200':
          description: Successfully created withdrawal request. Returns the created resource with generated IDs and timestamps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWithdrawalRequestsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
    get:
      tags:
      - Withdrawals
      summary: Get withdrawal requests
      description: Retrieves a list of all withdrawal requests created by users as part of your participant. Results are limited to the last 2 months.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: participant_code
        in: query
        description: Filters for withdrawal request by a specific `participant_code`
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Filters for a specific page (pagination)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter for a specific withdrawal status. Must be provided in upper case.
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SETTLED
      - name: gas_price
        in: query
        description: Filter for a specific `gas_price` value. Applies only to ERC-20 withdrawals.
        required: false
        schema:
          type: string
      - name: client_withdrawal_request_id
        in: query
        description: Filter for client withdrawal request id
        required: false
        schema:
          type: string
      - name: requested_timestamp[gt]
        in: query
        description: Filter for withdrawal requests whose `requested_timestamp` is greater than the given Unix timestamp (in milliseconds).
        required: false
        schema:
          type: string
          pattern: ^[0-9]{13,19}$
      - name: requested_timestamp[gte]
        in: query
        description: Filter for withdrawal requests whose `requested_timestamp` is greater than or equal to the given Unix timestamp (in milliseconds).
        required: false
        schema:
          type: string
          pattern: ^[0-9]{13,19}$
      - name: requested_timestamp[e]
        in: query
        description: Filter for withdrawal requests whose `requested_timestamp` equals the given Unix timestamp (in milliseconds).
        required: false
        schema:
          type: string
          pattern: ^[0-9]{13,19}$
      - name: requested_timestamp[lt]
        in: query
        description: Filter for withdrawal requests whose `requested_timestamp` is less than the given Unix timestamp (in milliseconds).
        required: false
        schema:
          type: string
          pattern: ^[0-9]{13,19}$
      - name: requested_timestamp[lte]
        in: query
        description: Filter for withdrawal requests whose `requested_timestamp` is less than or equal to the given Unix timestamp (in milliseconds).
        required: false
        schema:
          type: string
          pattern: ^[0-9]{13,19}$
      - name: on_chain_status
        in: query
        description: Filter for on-chain status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - CONFIRMED
      - name: account_label
        in: query
        description: Filter for a specific account label
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'Successfully retrieved paginated list of withdrawal requests with optional filters: participant_code, page, status, gas_price, client_withdrawal_request_id, requested_timestamp, on_chain_status, account_label.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawalRequestsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/requests/{id}:
    get:
      tags:
      - Withdrawals
      summary: Get withdrawal request
      description: Retrieves a specific withdrawal request by `id` associated with your participant or platform.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: id
        in: path
        description: Withdrawal request id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved withdrawal request. including status, amounts, fees, and on-chain confirmation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawalRequestResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
    delete:
      tags:
      - Withdrawals
      summary: Delete withdrawal request
      description: Rejects a pending withdrawal request.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: id
        in: path
        description: withdrawal request id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted withdrawal request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWithdrawalRequestResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/execute:
    post:
      tags:
      - Withdrawals
      summary: Execute withdrawal
      description: Executes a withdrawal that has been previously quoted.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        description: Withdrawal execution details including quote ID and confirmation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalExecuteRequest'
      responses:
        '200':
          description: Successfully executed withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalExecuteResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/uma:
    post:
      tags:
      - Withdrawals
      summary: Request UMA Withdrawal
      description: Requests a withdrawal to an UMA address (on Lightning Network).
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      requestBody:
        description: UMA withdrawal request details including UMA address and amount.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalUmaRequest'
      responses:
        '200':
          description: Successfully created UMA withdrawal request. Returns the created resource with generated IDs and timestamps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalUmaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/umalookup/{recipient}:
    get:
      tags:
      - Withdrawals
      summary: Performs an UMA lookup prior to initiating a withdrawal
      description: Verifies UMA address of a recipient and returns details of supported receiving currencies` (on Lightning Network).
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: recipient
        in: path
        required: true
        description: The full UMA address of the withdrawal recipient.
        example: $satoshi@vasp.com
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved UMA lookup result. including the list of currencies the recipient VASP can receive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalUmaLookupResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/digital_asset_addresses:
    get:
      tags:
      - Withdrawals
      summary: Get withdrawal addresses
      description: Retrieves a list of all withdrawal addresses created by users as part of your participant.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: participant_code
        in: query
        description: Filters for withdrawal addresses by a specific `participant_code`
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Filters for a specific page (pagination)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'Successfully retrieved paginated list of withdrawal addresses with optional filters: participant_code, page.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawalAddressesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/digital_asset_addresses/{id}:
    get:
      tags:
      - Withdrawals
      summary: Get withdrawal address
      description: Retrieves a specific crypto withdrawal account associated with your participant or platform.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: id
        in: path
        description: withdrawal account id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved crypto withdrawal account. including address, asset, and whitelist details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawalAccountById'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/locked_network_fee:
    get:
      tags:
      - Withdrawals
      summary: Get withdrawal quote
      description: Returns a locked network fee quote for a planned crypto withdrawal. The returned `withdrawal_quote_id` is valid for 30 seconds and must be passed to POST /withdrawals/execute to complete the withdrawal. Exactly one of `withdrawal_account_id` or `withdrawal_address` must be supplied; if `max_amount` is `false` (the default), `amount` is required.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: participant_code
        in: query
        description: The participant the withdrawal will be debited from. 6-character alphanumeric code.
        required: true
        schema:
          type: string
          minLength: 6
          maxLength: 6
      - name: account_group
        in: query
        description: The `account_group` for the source account. Defaults to the caller's `participant_code` when omitted.
        required: false
        schema:
          type: string
      - name: account_label
        in: query
        description: The `account_label` for the source account. Defaults to `general` when omitted.
        required: false
        schema:
          type: string
          maxLength: 50
      - name: asset
        in: query
        description: The asset code of the asset being withdrawn, e.g. BTC.
        required: true
        schema:
          type: string
      - name: amount
        in: query
        description: The requested withdrawal amount. Required (and must be positive) unless `max_amount` is `true`.
        required: false
        schema:
          type: string
      - name: max_amount
        in: query
        description: When `true`, zerohash will generate a withdrawal for the full available balance of `asset` in the source account; in that case `amount` can be omitted. Defaults to `false`. Accepted as the string `"true"` or `"false"`.
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: withdrawal_account_id
        in: query
        description: The `withdrawal_account_id` of the whitelisted destination account. Required when `withdrawal_address` is not provided.
        required: false
        schema:
          type: string
      - name: withdrawal_address
        in: query
        description: The on-chain address that will receive the crypto asset. Required when `withdrawal_account_id` is not provided.
        required: false
        schema:
          type: string
      - name: destination_tag
        in: query
        description: The destination tag or memo ID associated with the transaction. Required when the asset is EOS, XLM, or XRP and `no_destination_tag` is `false`.
        required: false
        schema:
          type: string
      - name: no_destination_tag
        in: query
        description: Whether the destination address requires a destination tag. Required for tag-based assets (EOS, XLM, XRP). zerohash requires `no_destination_tag` to be `false` for EOS. Accepted as the string `"true"` or `"false"`.
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Successfully retrieved locked network fee quote. including `withdrawal_quote_id`, `net_withdrawal_quantity`, and the locked network/withdrawal fees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLockedNetworkFeeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/fiat_accounts:
    get:
      tags:
      - Withdrawals
      summary: Get fiat accounts
      description: 'Retrieves a list of all whitelisted fiat withdrawal accounts.

        Fiat accounts are currently whitelisted via the Client Portal only.'
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: Successfully retrieved paginated list of whitelisted fiat withdrawal accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawalFiatAccountsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/fiat_accounts/{id}:
    get:
      tags:
      - Withdrawals
      summary: Get fiat account
      description: Retrieves a specific fiat withdrawal account that has been whitelisted.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: id
        in: path
        description: Withdrawal account id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved fiat withdrawal account. including account details and whitelist status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawalFiatAccountById'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/estimate_network_fee:
    get:
      tags:
      - Withdrawals
      summary: Get network fee estimate
      description: Returns a withdrawal estimation for a given asset.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: underlying
        in: query
        description: the underlying asset for the quote
        required: true
        schema:
          $ref: '#/components/schemas/UnderlyingCurrency'
      - name: quoted_currency
        in: query
        description: the quoted asset for the quote
        required: true
        schema:
          $ref: '#/components/schemas/QuotedCurrency'
      - name: amount
        in: query
        description: the amount of the `underlying` currency
        required: false
        schema:
          type: string
      - name: destination_address
        in: query
        description: The destination_address is the receiving address for the withdrawal request
        required: true
        schema:
          type: string
      - name: contract_call
        in: query
        description: In a future release, this field will denote if the destination address is a smart contract address. False is the only acceptable value for now.
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Successfully retrieved network fee estimate. including gas price, network fees, and quoted amounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetNetworkEstimateFeeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
  /withdrawals/validate_address:
    get:
      tags:
      - Withdrawals
      summary: Validate address
      description: Checks whether a withdrawal address is valid for a given asset. For tag-based assets (e.g. XRP, XLM, EOS), also validates whether a destination tag or memo is required.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: asset
        in: query
        description: The asset symbol
        required: true
        schema:
          type: string
      - name: address
        in: query
        description: The address to validate
        required: true
        schema:
          type: string
      - name: destination_tag
        in: query
        description: Used for tag based assets
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved address validation result. with a `message` string indicating whether the address is valid for the given asset.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GetValidateAddressValidResponse'
                - $ref: '#/components/schemas/GetValidateAddressInvalidResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code500'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code503'
components:
  schemas:
    GetWithdrawalAccountById:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/WithdrawalAddressesEntity'
    PostWithdrawalRequestsBody:
      type: object
      title: Post Withdrawal Requests Body, all accepted fields
      properties:
        client_withdrawal_request_id:
          type: string
          description: "A unique identifier for the withdrawal, generally produced by the Platform on which the trade was executed\n      Note: this must be unique, per platform, per 24 hour period"
          example: c6af3d80-1aca-4280-b96b-a9b8d7ced46a
        withdrawal_account_id:
          type: string
          description: "The whitelisted withdrawal account or address to withdraw funds to\n      Note: only one of withdrawal_account_id, address or account{} can be submitted per withdrawal, but zerohash will always respond with withdrawal_account_id"
          example: '146'
        address:
          type: string
          description: "The whitelisted withdrawal account or address to withdraw funds to\n        Note: only one of withdrawal_account_id, address or account{} can be submitted per withdrawal, but zerohash will always respond with withdrawal_account_id"
          example: 2NCgV7BXXafJZ86utcYFs5m3tCpkcpLafeG
        account:
          type: object
          description: "The whitelisted withdrawal account or address to withdraw funds to\n        Note: only one of withdrawal_account_id, address or account{} can be submitted per withdrawal, but zerohash will always respond with withdrawal_account_id"
          properties:
            name:
              type: string
              description: "The nickname given to the withdrawal account\n            Note: zerohash will append the last 4 digits of the account number to this when saving it"
            limit:
              type: number
              description: The limit applied to the account on a per-withdrawal basis
            type:
              type: string
              description: 'The type of account: REAL_TIME_FIAT for 24/7 USD withdrawals, DOMESTIC_FIAT for US wires or INTERNATIONAL_FIAT for international wires'
            beneficiary_name:
              type: string
              description: The owner of the account at the withdrawal destination
            account_number:
              type: string
              description: The unique IBAN or account number for the final withdrawal destination
            bank_name:
              type: string
              description: The name of the destination financial institution
            routing_number:
              type: string
              description: For US wires, the ABA routing number identifies the destination financial institution
            swift_code:
              type: string
              description: SWIFT code, if applicable
            recipient_instructions:
              type: string
              description: Per-request memo or wire reference for this withdrawal. Overrides the account-level default if provided. An empty string explicitly clears the memo. Omitting this field leaves the account-level value unchanged. Max 255 characters.
              maxLength: 255
              example: 'Invoice #123'
            intermediary_bank:
              type: boolean
              description: Whether or not an intermediary bank is used
            intermediary_bank_name:
              type: string
              description: Intermediary bank name, if applicable
            intermediary_bank_code_type:
              type: string
              description: "Intermediary bank identifier code type, if applicable\n          Options include SWIFT"
            intermediary_bank_code:
              type: string
              description: Intermediary bank identifier that corresponds to intermediary_bank_code_type, if applicable
            intermediary_bank_account_number:
              type: string
              description: Intermediary bank IBAN or account number, if applicable
            correspondent_bank_name:
              type: string
              description: Correspondent bank name, if applicable
            correspondent_bank_code_type:
              type: string
              description: "Correspondent bank identifier code type, if applicable\n          Options include SWIFT"
            correspondent_bank_code:
              type: string
              description: Correspondent bank identifier that corresponds to correspondent_bank_code_type, if applicable
            correspondent_bank_account_number:
              type: string
              description: Correspondent bank IBAN or account number, if applicable
        participant_code:
          type: string
          description: The participant code against whom the withdrawal will be made
          example: ABCDEF
        beneficiary_participant_code:
          type: string
          description: The identifier of the participant benefiting from the withdrawal request.
          example: BENEFI
        sender_participant_code:
          type: string
          description: The identifier of the participant initiating the withdrawal on behalf of `participant_code`. Only applicable when operating on behalf of a third party.
          example: SENDER
        beneficiary_first_name:
          type: string
          description: "The first name of the participant benefiting from the quote request\n        Only applies to individual beneficiaries. Cannot be used along with business_beneficiary_name.\n        Note: Redundant if beneficiary_participant_code is provided in request"
          example: John
        beneficiary_last_name:
          type: string
          description: "The last name of the participant benefiting from the quote request\n        Only applies to individual beneficiaries. Cannot be used along with business_beneficiary_name.\n        Note: Redundant if beneficiary_participant_code is provided in request"
          example: Doe
        beneficiary_business_name:
          type: string
          description: "The name of the the business participant benefiting from the quote request\n        Only applies to business beneficiaries. Cannot be used along with first/last_beneficiary_name.\n        Note: Redundant if beneficiary_participant_code is provided in request"
          example: ACME Inc.
        account_group:
          type: string
          description: The account group to withdraw against, e.g. 00SCXM for the Seed Digital Commodities Market account group
          example: 00SCXM
        account_label:
          type: string
          description: The account label associated with the account
          example: sub_account_test
        amount:
          type: string
          description: The amount to withdraw
          example: '20.1'
        asset:
          type: string
          enum:
          - XRP
          - XLM
          - EOS
          - ADA
          - ALGO
          description: The asset code for the withdrawal request, e.g. XRP.
          example: BTC
        destination_tag:
          type: string
          description: "The destination tag or memo ID associated with the transaction\n      If the asset is EOS, XLM or XRP and no_destination_tag is false, then this is required"
        no_destination_tag:
          type: boolean
          description: "Whether or not the specific withdrawal and destination address requires a destination tag.If the asset `model` is `tag`, this field is required\n **Note: zerohash requires that `no_destination_tag` be `false` for `EOS`**."
          example: false
        gas_price:
          type: string
          description: Applicable only for ERC-20 tokens, the transaction fee payable on the Ethereum network - refer to our FAQ on how this works
          example: '0.0001'
        input_data:
          type: string
          description: Applicable only for smart contract executions on the Ethereum blockchain. This is the ABI encoding of the function and its arguments in RLP format.
        trade_id:
          type: string
          description: If provided will apply the earlier agreed-upon network fee amount from the provided trade.
          example: a81bc81b-dead-4e5d-abff-90865d1e13b1
    WithdrawalUmaLookupResponse:
      type: object
      properties:
        currencies:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The ISO 4217 (if applicable) currency code. For cryptocurrencies, this will be a ticker symbol, such as BTC for Bitcoin.
                example: USD
              symbol:
                type: string
                description: The display symbol of the currency.
                example: $
              name:
                type: string
                description: The full display name of the currency.
                example: US Dollars
              multiplier:
                type: string
                description: The estimated exchange rate in satoshis per smallest "unit" of this currency.
                example: '0.062'
              decimals:
                type: number
                description: The number of digits after the decimal point for display on the sender side, and to add clarity around what the "smallest unit" of the currency is. For example, in USD, by convention, there are 2 digits for cents - 5.95 USD. In this case, `decimals` would be 2. Note that the multiplier is still always in the smallest unit (cents).
                example: 2
              min:
                type: string
                description: The smallest amount of this currency that can be sent in a transaction.
                example: '100'
              max:
                type: string
                description: The largest amount of this currency that can be sent in a transaction.
                example: '250000'
    Code503:
      type: object
      description: 'A downstream dependency was unavailable, timed out, or returned a retryable error. Safe to retry; the response carries a `zh-allow-retry: true` header.'
      required:
      - error
      properties:
        error:
          type: string
          example: Service Unavailable
    Code404:
      type: object
      description: The requested resource does not exist or is not visible to the caller.
      required:
      - error
      properties:
        error:
          type: string
          example: Not Found
    WithdrawalUmaResponse:
      type: object
      properties:
        platform_code:
          type: string
          description: zerohash platform code of the submitting platform.
          example: JDNQGG
        participant_code:
          type: string
          description: The participant code of the sender.
          example: D3SCYB
        sender_uma_address:
          type: string
          description: The registered UMA address of the sender.
          example: $sender@uma.zerohash.id
        recipient_uma_address:
          type: string
          description: The UMA address of the recipient.
          example: $satoshi@vasp.com
        amount_sats:
          type: string
          description: The amount to be sent specified in Satoshis.
          example: '900'
        sender_fee_sats:
          type: string
          description: Satoshis charged (by zerohash and the estimated network fee) for the withdrawal.
          example: '179'
        receiving_currency:
          type: string
          description: Currency to be received by the recipient (this is converted by the receiving VASP).
          example: SAT
        amount_receiving_currency:
          type: string
          description: The final amount to be received in the 'receiving_currency'.
          example: '900'
        receiving_currency_multiplier:
          type: string
          description: Satoshis per unit of receiving currency as quoted by the receiving VASP.
          example: '1.000000000'
        receiver_exchange_fee_sats:
          type: string
          description: Satoshis to perform the currency exchange to 'receiving_currency' as quoted by the receiving VASP.
          example: '100'
        decimals:
          type: number
          description: The number of digits after the decimal point for the receiving_currency
          example: '0'
        invoice:
          type: string
          description: "Bolt11 invoice for the withdrawal. This string can be submitted to \n      'POST /withdrawals/requests' as a 'destination_address' to initiate payment."
          example: lnbcrt...nvrx9
        payee_name:
          type: string
          description: The name of the payee receiving the withdrawal.
          example: John Doe
        payee_email:
          type: string
          description: The email address of the payee receiving the withdrawal.
          example: john.doe@example.com
