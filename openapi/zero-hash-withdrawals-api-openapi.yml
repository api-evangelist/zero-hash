        recipient_uma_address:
          type: string
          description: The UMA address of the recipient. (Required)
          example: $satoshi@vasp.com
        amount_sats:
          type: string
          description: The amount to be sent specified in Satoshis. (Optional)
          example: '1000'
        receiving_currency:
          type: string
          description: If specified, the receiving VASP will convert the incoming BTC into this currency. (Optional)
          example: SAT
        amount_receiving_currency:
          type: string
          description: The amount to be sent specified in the smallest unit of the receiving currency (eg. cents for USD). (Optional)
          example: '1000'
        client_withdrawal_request_id:
          type: string
          description: A unique identifier for the withdrawal produced by the Platform. (Optional)
          example: 5c080f8a-f993-4cc4-9b33-326c4b765105
  parameters:
    Signature:
      name: X-SCX-SIGNED
      in: header
      description: HMAC-SHA256 signature of the request, base64-encoded. See the [Authentication guide](https://docs.zerohash.com/reference/api-authentication) for the exact signing formula.
      required: true
      schema:
        type: string
    Timestamp:
      name: X-SCX-TIMESTAMP
      in: header
      description: Current Unix timestamp in seconds. Must be within 60 seconds of server time or the request is rejected.
      required: true
      schema:
        type: string
        example: '1678901234'
  securitySchemes:
    apiKey:
      type: apiKey
      description: Your API public key. See the [Authentication guide](https://docs.zerohash.com/reference/api-authentication) for how to obtain keys.
      in: header
      name: X-SCX-API-KEY
    apiPassphrase:
      type: apiKey
      description: The passphrase associated with your API key, set when the key was created.
      in: header
      name: X-SCX-PASSPHRASE
x-readme:
  proxy-enabled: false
