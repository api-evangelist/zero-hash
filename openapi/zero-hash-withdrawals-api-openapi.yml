    Code400:
      type: object
      description: Request was rejected by validation or a downstream service. `errors` is an array of human-readable messages; each entry describes a single validation failure or business-rule violation.
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: string
          example:
          - body/amount must be >= 0
          - body/asset is required
    GetWithdrawalRequestResponse:
      type: object
      properties:
        message:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalRequestEntity'
    WithdrawalRequestEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUID v4) for the withdrawal request.
          example: 9084dd8f-ab9f-4f9b-a22b-49bdb4915a93
        withdrawal_account_id:
          type: number
          description: The ID of the whitelisted withdrawal account or address the funds were sent to.
          example: 3709509
        participant_code:
          type: string
          description: The participant the request belongs to, e.g. ABCDEF.
          example: ABCDEF
        beneficiary_participant_code:
          type: string
          nullable: true
          description: The participant code of the beneficiary when the withdrawal is being made on behalf of another participant. Null for standard withdrawals.
          example: null
        sender_participant_code:
          type: string
          nullable: true
          description: The participant code of the sender when the request was initiated on behalf of a third party. Null for standard withdrawals.
          example: null
        requestor_participant_code:
          type: string
          description: The participant code of the platform or participant that initiated the request, e.g. ABCDEF.
          example: ABCDEF
        requested_amount:
          type: string
          description: The initially requested amount, e.g. 100.10.
          example: '0.1004142'
        settled_amount:
          type: string
          nullable: true
          description: The settled amount. This can be less than or equal to the requested_amount. Null while the withdrawal is still in an APPROVED state.
          example: '0.100414200000000000'
        status:
          type: string
          description: The current status of the withdrawal request.
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SETTLED
          example: APPROVED
        asset:
          type: string
          description: The asset code for the request, e.g. `BTC`.
          enum:
          - AAVE.ETH
          - ADA
          - ALGO
          - AVAX
          - BAT.ETH
          - BCH
          - BTC
          - BUSD.ETH
          - COMP.ETH
          - DAI.ETH
          - DOGE
          - DOT
          - EGLD
          - EOS
          - ETC
          - ETH
          - ETH.ARBITRUM
          - GRT.ETH
          - GYEN.ETH
          - HBAR
          - LINK.ETH
          - LTC
          - LUNA
          - MATIC.ETH
          - MATIC.POLYGON
          - MKR.ETH
          - MOB
          - SAND.ETH
          - SOL
          - UNI.ETH
          - USDC.ETH
          - USDC.ALGO
          - USDC.POLYGON
          - USDC.SOL
          - USDC.HBAR
          - USDC.XLM
          - USDC.AVAX
          - USDT.ETH
          - UST
          - WBTC.ETH
          - XEM
          - XLM
          - XRP
          - XTZ
          - ZUSD.ETH
          example: BTC
        account_group:
          type: string
          description: The account group the request was made against, e.g. 00SCXM for the Seed Digital Commodities Market account group.
          example: 00SCXM
        account_label:
          type: string
          nullable: true
          description: The account label associated with the account. Null when the request targets the default (unlabeled) account.
          example: null
        transaction_id:
          type: string
          nullable: true
          description: The on-chain transaction hash once the withdrawal has been broadcast. Null until the transaction has been sent to the network.
          example: '0x0c36fd59b0f48257b5cd02cdf23fd8fb8230e27c5ddd28ce02c8a6a4736da4e6'
        input_data:
          type: string
          nullable: true
          description: Applicable only for smart-contract executions on the Ethereum blockchain. The ABI encoding of the function and its arguments in RLP format. Null for standard transfers.
          example: null
        requested_timestamp:
          type: number
          format: int64
          description: Unix timestamp in milliseconds for when the withdrawal request was last updated. Changes with status updates.
          example: 1777830138534
        created_timestamp:
          type: string
          format: date-time
          description: RFC 3339 / ISO 8601 timestamp (UTC) of when the withdrawal request was originally created. Immutable.
          example: '2026-05-03T17:40:10.733Z'
        gas_price:
          type: string
          nullable: true
          description: The transaction fee payable on the Ethereum network. Null when the asset is not an ERC-20 token or when the fee was not client-supplied.
          example: null
        client_withdrawal_request_id:
          type: string
          nullable: true
          description: A unique identifier for the withdrawal, generally produced by the Platform on which the trade was executed. Must be unique per platform per 24-hour period. Null when not provided by the client.
          example: 20aed707-3127-427d-a47e-97efc6470cb3
        on_chain_status:
          type: string
          nullable: true
          description: Indicates whether the crypto withdrawal has been confirmed on-chain. Null for fiat withdrawals or while the request is still APPROVED and has not been broadcast.
          enum:
          - PENDING
          - CONFIRMED
          - null
          example: CONFIRMED
        fee_amount:
          type: string
          nullable: true
          description: The network fee (denominated in the network fee asset) associated with the withdrawal. Null until the fee has been determined.
          example: '0.000004021417575'
        withdrawal_fee:
          type: string
          nullable: true
          description: The withdrawal fee (denominated in the withdrawn asset) charged by zerohash. Returned as an empty string or null when no withdrawal fee applies.
          example: '0'
        quoted_fee_amount:
          type: string
          nullable: true
          description: The fee paid by the customer in crypto terms as quoted. Null when the withdrawal did not go through the quoted-fee flow.
          example: null
        quoted_fee_notional:
          type: string
          nullable: true
          description: The fee paid by the customer in USD terms as quoted. Null when the withdrawal did not go through the quoted-fee flow.
          example: null
        quoted_fee_asset:
          type: string
          nullable: true
          description: The asset in which the quoted fee was charged. Null when the withdrawal did not go through the quoted-fee flow.
          example: null
        trade_id:
          type: string
          nullable: true
          format: uuid
          description: When a fee-locked `trade_id` was supplied on the withdrawal request, the associated trade identifier. Null otherwise.
          example: null
        parent_link_id:
          type: string
          nullable: true
          description: Identifier linking this withdrawal to a parent request (for example a convert-and-withdraw quote execution). Null for standalone withdrawals.
          example: null
        parent_link_id_source:
          type: string
          nullable: true
          description: The source context of the `parent_link_id` when present. Null when `parent_link_id` is null.
          example: null
        amount_in_usd:
          type: number
          nullable: true
          description: Indicative USD value of the withdrawal at the time the record was returned. Present on list responses for all consumers; conditionally omitted on single-request responses for non-portal origins.
          example: 234.32708342365032
        contract_validation_id:
          type: string
          nullable: true
          format: uuid
          description: Identifier of the EVM smart-contract execution validation record linked to the withdrawal. Null unless the withdrawal targets a validated contract call.
          example: null
        recipient_instructions:
          type: string
          nullable: true
          description: Recipient instructions for this withdrawal request (e.g. wire memo). Returns the request-level memo if provided, otherwise the account default, or null when none is set.
          example: 'Invoice #123'
