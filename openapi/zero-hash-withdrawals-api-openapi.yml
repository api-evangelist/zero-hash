    GetValidateAddressValidResponse:
      type: object
      properties:
        message:
          type: string
          description: The message will be “valid” if the address is valid for the given asset
          example: the address is valid
    QuotedCurrency:
      type: string
      description: the quoted asset
      example: USD
      enum:
      - CAD
      - EUR
      - GBP
      - JPY
      - MXN
      - USD
    Code403:
      type: object
      description: Authentication or authorization failed. `error` is always `true`; `message` explains which check failed (missing API key, bad signature, insufficient permission, etc.).
      required:
      - error
      - message
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: This api key does not have write permission to this endpoint
    GetWithdrawalFiatAccountById:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/FiatAccountsEntity'
    LockedNetworkFeeEntity:
      type: object
      description: Locked network fee quote returned by GET /withdrawals/locked_network_fee. The quote is valid for 30 seconds and must be referenced by `withdrawal_quote_id` when calling POST /withdrawals/execute.
      properties:
        participant_code:
          type: string
          description: The participant the withdrawal will be debited from.
          example: ABCDEF
        account_group:
          type: string
          description: The `account_group` for the source account the withdrawal will be debited from.
          example: JMCH0H
        account_label:
          type: string
          description: The `account_label` for the source account the withdrawal will be debited from.
          example: general
        asset:
          type: string
          description: The asset being withdrawn.
          example: BTC
        amount:
          type: string
          description: The amount requested for the withdrawal.
          example: '0.04867615'
        max_amount:
          type: boolean
          description: When `true`, the quote was generated for the full available balance of `asset` in the source account rather than a specific `amount`. Defaults to `false`.
          example: false
        withdrawal_account_id:
          type: string
          description: The whitelisted withdrawal account identifier associated with the destination address. Empty string when the quote was requested by raw `withdrawal_address`.
          example: ''
        withdrawal_address:
          type: string
          description: The on-chain address that will receive the crypto asset. Echoes the `withdrawal_address` supplied on the request.
          example: bc1qy08yh0cm565gvtx2z80dz6dnyr635mwtknl36e
        destination_tag:
          type: string
          description: The destination tag or memo ID associated with the transaction. Required when the asset is EOS, XLM, or XRP and `no_destination_tag` is false. Empty string when not applicable.
          example: ''
        no_destination_tag:
          type: boolean
          description: Whether the destination address requires a destination tag. Required for tag-based assets (EOS, XLM, XRP); zerohash requires `no_destination_tag` to be `false` for EOS.
          example: false
        withdrawal_quote_id:
          type: string
          format: uuid
          description: Unique ID for this locked network fee quote. Supply this value to POST /withdrawals/execute to complete the withdrawal. Quotes are valid for 30 seconds.
          example: bdc4c936-8505-4e61-b859-f3a5a6bdc880
        network_fee:
          type: string
          description: The network fee quantity that will be deducted from the requested withdrawal amount.
          example: '0.00000282'
        network_fee_notional:
          type: string
          description: The network fee notional value in USD.
          example: '0.22'
        net_withdrawal_quantity:
          type: string
          description: 'The asset quantity that will arrive on-chain: requested withdrawal amount minus the network fee.'
          example: '0.04867333'
        net_withdrawal_notional:
          type: string
          description: 'The notional value in USD that will arrive on-chain: `amount_notional` minus `network_fee_notional`.'
          example: '3832.29'
        amount_notional:
          type: string
          description: The notional USD value of the requested withdrawal amount.
          example: '3832.51'
        withdrawal_fee:
          type: string
          description: The withdrawal fee (denominated in the withdrawn asset) that will be charged by zerohash. Returns "0" when no withdrawal fee applies.
          example: '0'
    GetNetworkEstimateFeeResponse:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/NetworkFeeEntity'
    GetWithdrawalFiatAccountsResponse:
      type: object
