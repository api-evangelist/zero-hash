            type: boolean
            description: Indicates whether a user has been flagged in an IRS B-Notice as not having up-to-date tax information on file. Required for customers onboarded to a US platform.
            example: true
          w_form_certification:
            type: number
            description: 'Must be provided with `is_w_form_certified` boolean field to indicate the time at which the user certified their W-form.


              In the event the user transitions from an uncertified to a certified, the platform must provide a new `w_form_certification` and update `is_w_form_certified` from `false` to `true`.'
