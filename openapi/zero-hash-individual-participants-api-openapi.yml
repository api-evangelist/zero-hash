            type: number
            description: The UNIX timestamp (in milliseconds) when KYC was passed. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
            example: 1603378501286
          kyc:
            type: string
            enum:
            - pass
            - fail
            description: Whether the participant passed or failed KYC by vendor
            example: pass
          kyc_timestamp:
            type: number
            description: The UNIX timestamp (in milliseconds) when KYC was passed. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
            example: 1603378501286
          liveness_check:
            type: string
            enum:
            - pass
            - fail
            description: Whether the participant passed or failed a liveness check
            example: pass
          tax_id:
            type: string
            description: "The national ID of the participant, e.g. a social security number.\n - Required when `citizenship_code` is `US`.\n - Optional when `citizenship_code` is not `US`, but if provided, must be accompanied by a valid `id_number` and `id_number_type`.\n - If the tax ID provided is a US ITIN (a 9-digit US ID that begins with the number `9`), then `id_number_type` will be required."
            example: 000-00-0000
          signed_agreements:
            type: array
            items:
              type: object
              required:
              - type
              - region
              - signed_timestamp
              properties:
                type:
                  type: string
                  enum:
                  - fund_auto_convert
                  - payment_services_terms
                  - account_link
                  - account_funding_payouts
                  - account_funding_general
                  - account_funding_pay
                  - crypto_payouts_service_terms
                  - staking
