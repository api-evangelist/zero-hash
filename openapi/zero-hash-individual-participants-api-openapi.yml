                  - zhllc_privacy_policy_v1
                  - zhllc_regulatory_disclosures_v1
                  - auth_user_services_agreement_v1
                  - zhllc_payment_sender_terms_v1
                  - zhllc_third_party_disclosures_v1
                  - connect_privacy_policy_v1
                  example: user_agreement
                region:
                  type: string
                  enum:
                  - worldwide
                  - us
                  - brazil
                  - uk
                  - eu
                  example: us
                signed_timestamp:
                  type: number
                  description: The UNIX timestamp (in milliseconds) when the Fund Auto Convert Agreement was accepted by the participant. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
                  example: 1603378501286
