            example: '10000'
          savings_and_investments_amount:
            type: string
            description: The individual's total amount of savings and investments, in a currency (e.g., USD, EUR depends on region).
            example: '50000'
          gross_annual_income:
            type: string
            description: The individual's total pre-tax income from all sources annually, in a currency (e.g., USD, EUR depends on region).
            example: '60000'
