            description: "Backup withholding attestation flag. Required for customers onboarded to a US platform.\n - If the participant confirms they are **not** subject to backup withholding, this field should be set to `true`.\n - If the participant **is** subject to backup withholding, this field should be set to `false`.\nThis acts as a positive attestation that the participant confirms they are not subject to backup withholding."
            example: false
