            type: string
            description: "The national ID of the participant, e.g. a social security number.\n - Required when `citizenship_code` is `US`.\n - Optional when `citizenship_code` is not `US`, but if provided, must be accompanied by a valid `id_number` and `id_number_type`.\n - If the tax ID provided is a US ITIN (a 9-digit US ID that begins with the number `9`), then `id_number_type` will be required."
            example: 000-00-0000
          b_notice_receipt:
            type: boolean
            description: Indicates whether a user has been flagged in an IRS B-Notice as not having up-to-date tax information on file. Required for customers onboarded to a US platform.
            example: true
          tin_jurisdiction_reason:
            type: string
            enum:
            - working_abroad
            - studying_abroad
            - dual_residency
            - business_abroad
            - real_estate_abroad
            - other
            description: Optional. Reason for the tax residence jurisdiction differing from the legal jurisdiction. Defaults to "unknown" if not provided.
            example: working_abroad
