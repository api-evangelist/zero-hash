            type: string
            description: ISO-3166-1_A2 country code that issued the ID. Required if `id_number` is provided.
            example: null
          risk_rating:
            type: string
            enum:
            - low
            - medium
            - high
            description: The risk-rating associated with the customer, conditionally required for certain platforms
            example: null
          signed_timestamp:
            type: number
            description: The UNIX timestamp (in milliseconds) when the  Services Agreement was accepted by the participant. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
            example: 1603378501286
          metadata:
            oneOf:
            - type: object
              properties: {}
              description: Can be used to submit any additional unstructured metadata as JSON object
              example: {}
            - type: string
              description: Can be used to submit any additional unstructured metadata as JSON string
              example: '{"field1": "string_value", "field2": 123, "field3": true}'
          kyc:
            type: string
            enum:
            - pass
            - fail
            description: Whether the participant passed or failed KYC by vendor
            example: pass
          kyc_timestamp:
            type: number
            description: The UNIX timestamp (in milliseconds) when KYC was passed. This timestamp value must be from no longer than one (1) year in the past or one (1) day in the future.
            example: 1603378501286
          onboarding_profile:
            type: string
