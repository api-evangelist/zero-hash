            description: Optional. Additional tax residences when the participant has tax obligations in multiple jurisdictions. Maximum 25 items.
          platform_updated_at:
            type: number
            minLength: 13
            maxLength: 13
            example: 1667504636159
            description: Platform updated timestamp
        required:
        - platform_updated_at
        example:
          tax_id: 000-00-0000
          b_notice_receipt: true
          tin_jurisdiction_reason: working_abroad
          platform_updated_at: 1680643465352
