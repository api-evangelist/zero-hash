              tax_id:
                type: string
                description: "The national ID of the participant, e.g. a social security number.\n - Required when `citizenship_code` is `US`.\n - Optional when `citizenship_code` is not `US`, but if provided, must be accompanied by a valid `id_number` and `id_number_type`.\n - If the tax ID provided is a US ITIN (a 9-digit US ID that begins with the number `9`), then `id_number_type` will be required."
                example: 000-00-0000
              id_number_type:
                type: string
                enum:
                - us_drivers_license
                - us_passport
                - us_passport_card
                - us_permanent_resident_card
                - us_border_crossing_card
                - us_alien_card
                - us_id_card
                - non_us_passport
                - non_us_other
                - passport
                - eu_drivers_license
                - national_id
                description: "\n### Region-specific guidelines\n\n### Platforms integrated to zerohash USA;\n - Required when `citizenship_code` is not `US`.\n - Required when `citizenship_code=US` but `tax_id` is an ITIN (a 9-digit US ID that begins with the number `9`).\n---\n### Platforms integrated to zerohash EU;\nThe following enums are EU-specific types:\n- `passport`\n- `eu_drivers_license`\n- `national_id`\n\nEU platforms can also accept:\n- `us_passport`\n- `non_us_passport` \n- `non_us_other`\n- `us_drivers_license`\n- `us_id_card`\n- `us_passport_card`"
                example: us_passport
              id_number:
                type: string
                description: "The ID number for the customer. \n - Required when `citizenship_code` is not `US`\n - Required when `citizenship_code : US` but `tax_id` is an ITIN (a 9-digit US ID that begins with the number `9`)."
