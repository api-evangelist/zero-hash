                - national_id
                description: "\n### Region-specific guidelines\n\n### Platforms integrated to zerohash USA;\n - Required when `citizenship_code` is not `US`.\n - Required when `citizenship_code=US` but `tax_id` is an ITIN (a 9-digit US ID that begins with the number `9`).\n---\n### Platforms integrated to zerohash EU;\nThe following enums are EU-specific types:\n- `passport`\n- `eu_drivers_license`\n- `national_id`\n\nEU platforms can also accept:\n- `us_passport`\n- `non_us_passport` \n- `non_us_other`\n- `us_drivers_license`\n- `us_id_card`\n- `us_passport_card`"
