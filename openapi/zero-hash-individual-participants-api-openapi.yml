    Code403:
      type: object
      description: Authentication or authorization failed. `error` is always `true`; `message` explains which check failed (missing API key, bad signature, insufficient permission, etc.).
      required:
      - error
      - message
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: This api key does not have write permission to this endpoint
    PatchParticipantLimitsBody:
      type: object
      required:
      - limits
      properties:
        limits:
          type: array
          description: Array of limit configurations to apply to the participant. Use empty array to clear all limits.
          items:
            type: object
            required:
            - type
            - period
            - configured_limit
            - asset
            properties:
              type:
                type: array
                description: Transaction types to which this limit applies
                minItems: 1
                items:
                  type: string
                  enum:
                  - trades
                  - transfers
                  - withdrawals
                  - deposits
                example:
                - trades
              period:
                type: number
                description: Time period in hours for the limit. Use 0 for lifetime limits.
                minimum: 0
                example: 24
              configured_limit:
                type: string
                description: The limit amount as a decimal string
                pattern: ^(?:\d+|\d*\.\d+)$
                example: '25000'
              asset:
                type: string
                description: The asset/currency for the limit
                example: USD
    PostDocumentsBody:
      oneOf:
      - title: Document - All accepted fields
        type: object
        description: All accepted fields for a document
        properties:
          document:
            type: string
            description: base 64 encoded file that you wish to upload (10mb limit)
            example: aGVsbG8gd29ybGQ=
          mime:
            type: string
            description: The MIME type of the file you are uploading
            example: pdf
          file_name:
            type: string
            description: The name of the document that you are uploading
            example: supporting_document.pdf
          participant_code:
            type: string
            description: Your participant code, or the participant_code of the customer on behalf of whom you are uploading the document
            example: CUST01
          document_type:
            type: string
            description: 'A valid ID type.


              **Additional shopper document types:** `source_of_funds_for_purchase`, `proof_of_employment_status`, and `proof_of_industry` are accepted for natural persons onboarded with `onboarding_profile: shopper`, in addition to the other document types listed here. They have no effect for participants on any other onboarding profile.'
            example: us_drivers_license
            enum:
            - us_drivers_license
            - us_passport
            - us_passport_card
            - us_permanent_resident_card
            - us_border_crossing_card
            - us_alien_card
            - us_id_card
            - non_us_passport
            - non_us_other
            - proof_of_income
            - eu_passport
            - eu_id_card
            - eu_drivers_license
            - eu_address_verification
            - form_w9
            - form_w8_ben
            - form_w8_ben_e
            - form_w8_imy
            - form_w8_eci
            - form_w8_exp
            - form_w8_ce
            - source_of_funds_for_purchase
            - proof_of_employment_status
            - proof_of_industry
            - miscellaneous
          id_front:
            type: boolean
            description: 'Optional field to indicate if the document is the front or back of an ID.

              The field is **mandatory** only for the following document types:: `us_drivers_license`, `us_permanent_resident_card`,

              `us_border_crossing_card`, `us_alien_card`, `us_id_card`, `us_passport_card`,

              `eu_id_card`, `eu_drivers_license`.'
