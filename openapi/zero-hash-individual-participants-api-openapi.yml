          is_w_form_certified:
            type: boolean
            description: "Indicates whether the participant is W-Form certified, required for customers onboarded to a US platform.\n\n - When `true`, user can be onboarded without restriction, so long as other mandatory fields are provided at time of onboarding.\n - When `false`, user is restricted and ineligible to transact on the platform."
            example: true
          w_form_certification:
            type: number
            description: 'Must be provided with `is_w_form_certified` boolean field to indicate the time at which the user certified their W-form.


