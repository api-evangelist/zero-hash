            properties:
              address_one:
                type: string
                description: First line of tax residence address
              address_two:
                type: string
                description: Second line of tax residence address (optional)
              city:
                type: string
                description: City of tax residence
              jurisdiction_code:
                type: string
                description: Jurisdiction code in ISO-3166-2 format
                example: PT-11
              postal_code:
                type: string
                description: Postal code of tax residence
          tin_jurisdiction_reason:
            type: string
            enum:
            - working_abroad
            - studying_abroad
            - dual_residency
            - business_abroad
            - real_estate_abroad
            - other
            description: Optional. Reason for the tax residence jurisdiction differing from the legal jurisdiction. Defaults to "unknown" if not provided.
            example: working_abroad
          additional_tax_residences:
            type: array
            maxItems: 25
            items:
              $ref: '#/components/schemas/AdditionalTaxResidence'
            description: Optional. Additional tax residences when the participant has tax obligations in multiple jurisdictions. Maximum 25 items.
          tin_jurisdiction_other:
            type: string
            description: Optional. Free text explanation when tin_jurisdiction_reason is "other"
          proof_of_address_coordinates:
            type: object
            description: GPS coordinates of the proof of address. Accepts both Decimal Degrees (DD) and Degrees Minutes Seconds (DMS) formats.
            properties:
              latitude:
                type: string
                description: Latitude in DD format (e.g., "51.511164") or DMS format (e.g., "N 51d 30.000000m 40.190000")
                pattern: ^(([NSEW])s+(d+(?:.d+)?)ds+(d+(?:.d+)?)ms+(d+(?:.d+)?)|(-?d+(?:.d+)?))$
                example: N 51d 30.000000m 40.190000
              longitude:
                type: string
                description: Longitude in DD format (e.g., "-0.083317") or DMS format (e.g., "W 0d 4.100000m 59.940000")
                pattern: ^(([NSEW])s+(d+(?:.d+)?)ds+(d+(?:.d+)?)ms+(d+(?:.d+)?)|(-?d+(?:.d+)?))$
                example: W 0d 4.100000m 59.940000
            required:
            - latitude
            - longitude
            additionalProperties: false
