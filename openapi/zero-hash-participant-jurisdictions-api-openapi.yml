  /jurisdiction/evaluate-onboarding:
    post:
      tags:
      - Participant Jurisdictions
      summary: Evaluate participant onboarding
      description: Returns a status whether the onboarding operation is allowed or not.
      parameters:
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Timestamp'
      - name: jurisdiction_code
        in: query
        description: Verify whether the calling platform is permitted to onboard to the given jurisdiction or not
        required: true
        schema:
          type: string
          example: US-NY
          pattern: ^[A-Z]{2}-[A-Z]{2}$
      responses:
        '200':
          description: Returns whether the calling platform is permitted to onboard participants into the given jurisdiction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEvaluateOnboardingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code400'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code403'
        '404':
          description: Not Found
          content:
