      - name: exclude_categories
        in: query
        description: Categories of news articles to be excluded from result, options can be fetched from the response of `GET /news/categories` endpoint.
        required: false
        schema:
          type: string
          enum:
          - TIA
          - APT
          - RON
          - ALGO
          - LINK
          - MATIC
          - DOT
          - EGLD
