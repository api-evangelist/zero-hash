              description: Identifier of the new retry transaction.
              example: 0f68333e-2114-469d-b505-c850d776e063
            status:
              type: string
              enum:
              - submitted
              - pending
              - pending_trade
              - posted
              - settled
              - cancelled
              - failed
              - returned
              - returned_settled
              - rejected
              - retried
