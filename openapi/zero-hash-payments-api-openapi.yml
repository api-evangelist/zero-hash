        request_id:
          type: string
          description: Request id
          example: 0f68333e-2114-469d-b505-c850d776e063
    PostPaymentsResponse:
      type: object
      oneOf:
      - title: Fiat transaction (pre-fund or ACH credit/debit)
        type: object
        properties:
          request_id:
            type: string
            format: uuid
            description: Request identifier echoed back from the request.
            example: a8eaccdf-7876-4123-94ed-125d8ec0bd1a
          transaction_id:
            type: string
            format: uuid
            description: Identifier of the created fiat transaction. Use `/payments/status` to poll for lifecycle updates.
            example: 9dc8b28e-92d4-4728-8777-d2f278e4bafc
          external_account_id:
            type: string
            format: uuid
            description: External fiat account used for the transaction.
            example: 12f4b661-1f36-4624-a13c-b0822d2ba1e1
          trade_id:
            type: string
            description: Linked trade identifier when the fiat transaction settles a trade. Empty string for stand-alone pre-funds.
            example: ''
          description:
            type: string
            description: Echoed `description` from the request (if any).
            example: pre-fund
          amount:
            type: string
            description: Transaction amount in the `currency` unit.
            example: '250'
          status:
            type: string
            enum:
            - submitted
            - pending
            - pending_trade
            - posted
            - settled
            - cancelled
            - failed
            - returned
            - returned_settled
            - rejected
            - retried
            - unspecified
            description: Initial ACH transfer status. Typically `submitted`.
            example: submitted
          transfer_type:
            type: string
            enum:
            - credit
            - debit
            - unspecified
            description: Whether the platform is crediting (pay-out) or debiting (pre-fund) the external account.
            example: debit
          network:
            type: string
            enum:
            - ach
            - same_day_ach
            - wire
            - rtp
            - unspecified
            description: Fiat rail selected for this transaction.
            example: same_day_ach
          participant_code:
            type: string
            description: Participant the transaction is associated with.
            example: ABCDEF
          account_label:
            type: string
            description: Account label on the participant side.
            example: general
          currency:
            type: string
            description: Fiat currency of the transaction.
            example: USD
          created_at:
            type: string
            format: date-time
            description: Creation time of the transaction. Omitted when the transaction is in `pending_trade` because the underlying transfer has not been created yet.
            example: '2026-05-04T11:00:26.260Z'
          ach_agreement_acceptance:
            type: object
            description: Present only when the client submitted `ach_agreement_acceptance` on the request and it was persisted.
            properties:
              timestamp:
                type: number
                format: int64
                description: Unix timestamp in seconds when the acceptance was signed.
                example: 1777895506
              version:
                type: string
                description: Version of the ACH agreement that was accepted.
                example: '1'
      - title: Payout
        type: object
        properties:
          request_id:
            type: string
            format: uuid
            description: Request identifier echoed back from the request.
            example: 85925258-b03e-4661-a7d8-583d8f66321e
          participant_code:
            type: string
            description: Participant the payout belongs to.
            example: ABCDEF
          platform_code:
            type: string
            description: Platform that initiated the payout.
            example: DEMO01
          obo_participant:
            $ref: '#/components/schemas/OBOParticipantEntity'
          payment_id:
            type: string
            format: uuid
            description: Identifier of the created payout. Use `/payments/{payment_id}` to fetch lifecycle state.
            example: f5159852-fb70-4139-8dd8-608781a12e1d
          asset:
            type: string
            description: Asset delivered to the external account.
            example: USDC
          network:
            type: string
            description: Blockchain network the payout is settled on.
            example: BASE
          quoted_asset:
            type: string
            description: Currency the payout amount was quoted in.
            example: USD
          status:
            type: string
            enum:
            - submitted
            - pending
            - posted
            - settled
            - failed
            - initialized
            - abandoned
            - unspecified
            description: Initial payout status; typically `submitted`.
            example: submitted
          external_account_id:
            type: string
            format: uuid
            description: External crypto account receiving the payout.
            example: b636e754-5cbf-42b9-b28a-8b18c04bcde3
          total:
            type: string
            description: Payout total in the `quoted_asset`. Present when the request supplied `total`.
            example: '125.08'
          quantity:
            type: string
            description: Payout quantity in the `asset`. Present when the request supplied `quantity`.
            example: '6.761693'
          reference_id:
            type: string
            description: Platform-supplied reference identifier passed through from the generating token. Empty string when not supplied.
            example: ''
          created_at:
            type: string
            format: date-time
            description: Creation time of the payout.
            example: '2026-05-04T11:05:48.307Z'
    PostPaymentsExecutePaymentRequest:
      type: object
      additionalProperties: false
      required:
      - participant_code
      - quote_id
      - ach_signed_agreement
      - external_account_id
      properties:
        participant_code:
          type: string
          minLength: 6
          maxLength: 6
          description: Participant code of the customer executing the quote.
          example: ABCDEF
        quote_id:
          type: string
          format: uuid
          description: Identifier of the quote returned by `POST /payments/rfq`. Must not have expired.
          example: b4e04dea-430c-49e9-97e4-bb201a2e1f4a
        ach_signed_agreement:
          type: number
          format: int64
          description: Unix timestamp in seconds at which the customer accepted the ACH debit authorization.
          example: 1777895506
        description:
          type: string
          maxLength: 10
          description: Optional free-text descriptor for the transaction (max 10 characters).
          example: crypto buy
        external_account_id:
          type: string
          description: Identifier of the previously-linked external fiat account that will be debited.
          example: 4f941b3b-df5a-4aae-85ee-d15a79077852
        account_group:
          type: string
          description: Optional override of the account group on the customer side. Defaults to the calling platform.
          example: ABCDEF
        network:
          type: array
          items:
            type: string
            enum:
            - ach
            - same_day_ach
            - rtp
          description: Ordered list of acceptable fiat rails. When omitted, the service picks the best eligible rail for the account.
          example:
          - same_day_ach
    PendingACHTransactions:
      type: object
      properties:
        processing_window_date:
          type: string
          format: date-time
          description: Processing window date the pending transaction is queued for.
          example: '2026-05-04T00:00:00.000Z'
        trade_id:
          type: string
          format: uuid
          description: Linked trade identifier.
          example: 0f34533e-2114-469d-b505-c850d776e061
        transaction_type:
          type: string
          enum:
          - credit
          - debit
          - unspecified
          description: Direction of the pending ACH transfer. `credit` pays the participant, `debit` pulls funds from the participant.
        participant_code:
