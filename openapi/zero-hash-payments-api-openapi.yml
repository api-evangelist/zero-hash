              example: '011401533'
            participant_code:
              type: string
              description: Participant code
              example: ALI123
            platform_code:
              type: string
              description: Platform code
              example: TES123
            account_nickname:
              type: string
              description: Account nickname
              example: test1
            account_type:
              type: string
              description: Fiat account type
              enum:
              - checking
              - savings
            status:
              type: string
              description: Account status
              enum:
              - pending
              - approved
              - rejected
              - locked
              - disabled
              - revoked
              - closed
            external_account_id:
              type: string
              description: Linked account id
              example: 0f68333e-2114-469d-b505-c850d776e063
            created_at:
              type: string
              format: date-time
              description: Creation timestamp of the account.
              example: '2026-05-04T11:54:13.099Z'
    Payment:
      type: object
      properties:
        payment_id:
          type: string
          description: Payment id
          example: 0f68333e-2114-469d-b505-c850d776e063
        payment_type:
          type: string
          description: type of the payment
